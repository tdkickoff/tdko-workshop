<title>Shirt Swap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Fast Break family. One narrow column; the six-row shirt board is the pitch, keyboard under it. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#0E1712; --muted:#5D6A62; --line:#D7DDD8;
  --accent:#0A8A4A; --accent-ink:#FFFFFF; --warn:#C98A00; --bad:#C93A2B; --soft:#E7ECE8;
  --miss:#7A857E; --key:#DDE3DE;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F;
  --miss:#3A443E; --key:#26302A; color-scheme:dark}}
:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F;
  --miss:#3A443E; --key:#26302A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
main{display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.mark{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:28px;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line)}
.inner{padding:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

.hero{display:flex;flex-direction:column;gap:14px;padding:26px 20px 22px}
.hero h1{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(60px,19vw,104px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 i{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--muted);margin:0;max-width:36ch}
.challenge{border:1.5px solid var(--accent);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.challenge span{font-size:15px}
.challenge b{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.rules li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.rules li>span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ladder div{padding:10px 4px 9px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--soft)}
.ladder b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;line-height:1}
.ladder span{font-family:var(--f-mono);font-size:11px;opacity:.85}
.demo{display:flex;gap:4px}

.btn{all:unset;box-sizing:border-box;display:block;text-align:center;cursor:pointer;background:var(--ink);color:var(--bg);touch-action:manipulation;
  font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:15px 12px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad);color:#fff}
.linkbtn{all:unset;cursor:pointer;align-self:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.linkbtn:hover{color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.confirm{border:1.5px solid var(--bad);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--bad);color:#fff}

/* mode tabs */
.modes{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.mode{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;border-bottom:3px solid transparent;text-align:center}
.mode b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:17px;text-transform:uppercase;line-height:1}
.mode span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mode.on{border-bottom-color:var(--ink)}
.mode.done span{color:var(--accent)} .mode.lost span{color:var(--bad)} .mode.open span{color:var(--warn)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* board */
.board{display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px 12px}
.row{display:flex;gap:5px}
.row.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tile{width:clamp(36px,11vw,52px);aspect-ratio:1;display:grid;place-items:center;box-sizing:border-box;border:2px solid var(--line);
  font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:clamp(20px,6vw,28px);text-transform:uppercase;line-height:1;background:var(--surface)}
.tile.typed{border-color:var(--muted)}
.tile.g{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.y{background:var(--warn);border-color:var(--warn);color:#111}
.tile.x{background:var(--miss);border-color:var(--miss);color:#fff}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.flip{animation:flip .4s ease both}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.fb{font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;min-height:18px;color:var(--muted)}
.fb.nudge{display:inline-block;padding:2px 6px;margin:-2px -6px;animation:nudge .5s,flash 1s}
@keyframes nudge{0%,100%{transform:none}15%{transform:translateX(-10px)}35%{transform:translateX(10px)}55%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes flash{0%,30%{background:color-mix(in oklab,var(--warn) 28%,transparent)}100%{background:transparent}}
.fb.bad{color:var(--bad)} .fb.good{color:var(--accent)} .fb.warn{color:var(--warn)}

/* keyboard */
.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kr{display:flex;gap:5px;justify-content:center}
.key{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;flex:1 1 0;max-width:44px;height:52px;display:grid;place-items:center;background:var(--key);color:var(--ink);
  font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:17px;text-transform:uppercase}
.key.wide{max-width:72px;flex:1.5 1 0;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em}
.key.g{background:var(--accent);color:var(--accent-ink)} .key.y{background:var(--warn);color:#111} .key.x{background:var(--miss);color:#fff}
.key:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* result */
.reveal{display:flex;flex-direction:column;gap:4px}
.reveal h2{margin:0;font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:clamp(36px,11vw,54px);line-height:.92;text-transform:uppercase;text-wrap:balance}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(88px,26vw,130px);line-height:.82;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:22px;margin:0;text-transform:uppercase}
.vs{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vs b{color:var(--ink)}
.share{display:flex;flex-direction:column;gap:10px}
.share h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.share img{display:block;width:100%;max-width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--soft)}
.share p{margin:0;font-size:13px;color:var(--muted)}
.sendto{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgt{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;touch-action:manipulation}
.tgt:hover{border-color:var(--ink)}
.tgt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tgt.wa{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
textarea.copybox{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:13px;background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:10px;min-height:130px}
.next{text-align:center;display:flex;flex-direction:column;gap:2px}
.next b{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;padding:10px 16px;max-width:calc(100% - 40px);text-align:center;z-index:5}
@keyframes fadein{from{opacity:.35}to{opacity:1}}
.enter{animation:fadein .18s ease-out}
@media (prefers-reduced-motion: reduce){.enter,.tile.flip,.row.shake{animation:none}.fb.nudge{animation:flash 1s}.btn{transition:none}}
.replaying .sharecard{display:none}.replaying header.top::after{content:"Replay · doesn’t count";flex-basis:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
</style>

<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){}
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });
</script>

const MODES = [{k:'e',L:5,name:'Easy'},{k:'m',L:6,name:'Medium'},{k:'h',L:7,name:'Hard'}];

const now = new Date();
const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const dayNo = LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
const TODAY = ANSWERS[(dayNo-1) % ANSWERS.length];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
const answerOf = m => norm(TODAY[m.L].split(' ').slice(-1)[0]);
const dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const REPLAY = tdkoIsReplay('shirt-swap', dayKey, dayNo), KEY = 'shirtswap:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
if(REPLAY){ tdkoReplayKey = KEY; document.documentElement.classList.add('replaying'); }
const app = document.getElementById('app');
document.getElementById('meta').textContent = `No. ${dayNo} · ${dateLabel}`;
const mh = /^#c(\d+)-(\d{1,3})(?:-(easy|medium|hard))?$/.exec(location.hash);
const challenge = (mh && +mh[1]===dayNo && +mh[2]<=100) ? {s:+mh[2], m:({easy:'e',medium:'m',hard:'h'})[mh[3]||'easy']} : null;
const VALID = {5:new Set(WORDS[5]),6:new Set(WORDS[6]),7:new Set(WORDS[7])};

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.modes) return s; }catch(e){} return null; }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date> → {gameId: {status, gaveUp}} */
function report(){ if(REPLAY) return; try{ const k='tdko:'+dayKey+'#'+dayNo, all=JSON.parse(localStorage.getItem(k)||'{}');
  const ms=Object.values(S.modes); const done=ms.some(x=>x.over), open=ms.some(x=>x.g.length||x.started);
  all['shirt-swap']={status: done?'done':open?'open':'ready', gaveUp: done && ms.filter(x=>x.over).every(x=>x.gaveUp)}; localStorage.setItem(k, JSON.stringify(all)); }catch(e){} }

let S = load() || {started:false, mode:(challenge&&challenge.m)||'e', modes:{e:{g:[],over:false,won:false},m:{g:[],over:false,won:false},h:{g:[],over:false,won:false}}};
const M = () => MODES.find(m=>m.k===S.mode), st = () => S.modes[S.mode];
const score = x => (x.gaveUp||!x.won) ? 0 : 110 - 10*x.g.length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function marks(guess, ans){ // standard two-pass colouring, handles repeated letters
  const res=Array(ans.length).fill('x'), left={};
  for(let i=0;i<ans.length;i++){ if(guess[i]===ans[i]) res[i]='g'; else left[ans[i]]=(left[ans[i]]||0)+1; }

}
let tt=0;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- intro ---------- */
function intro(){
  app.innerHTML = `
  <section class="card enter"><div class="hero">
    <h1>Shirt<br><i>Swap</i></h1>
    <p class="lede">Guess the surname on the back of the shirt in six tries. Three shirts every day.</p>
    ${challenge?`<div class="challenge"><span>A friend scored this on today's ${MODES.find(m=>m.k===challenge.m).name.toLowerCase()} shirt. Can you beat them?</span><b>${challenge.s}</b></div>`:''}
    <ul class="rules">
      <li><span>Shirts</span>Easy is 5 letters, medium 6, hard 7. One-name players count as their surname</li>
      <li><span>Colours</span>Green is the right letter in the right place, amber is in the name but elsewhere, grey is not in it</li>
      <li><span>Guesses</span>Each guess must be a footballer's surname</li>
      <li><span>Score</span>100 in one guess, 10 less for each extra guess. Finish any shirt and today's game is complete</li>
    </ul>
    <div class="demo" aria-label="Example: green, amber and grey tiles">${['g','y','x','x','g'].map((c,i)=>`<span class="tile ${c}">${'SALAH'[i]}</span>`).join('')}</div>
    <button class="btn" id="go">Pick a shirt</button>
  </div></section>`;
  onPress(document.getElementById('go'), ()=>{ S.started=true; save(); game(); });
}

/* ---------- game ---------- */
let cur='', fbMsg='', fbCls='', confirmOpen=false, revealRow=-1;
function tabs(){
  return `<div class="modes" role="tablist">${MODES.map(m=>{ const x=S.modes[m.k];
    const lab = x.over ? (x.gaveUp?'Gave up':x.won?`${x.g.length}/6 · ${score(x)}`:'Missed') : x.g.length ? `${x.g.length}/6` : `${m.L} letters`;
    const cls = x.over ? (x.won&&!x.gaveUp?'done':'lost') : x.g.length ? 'open' : '';
    return `<button class="mode ${cls}${m.k===S.mode?' on':''}" role="tab" aria-selected="${m.k===S.mode}" data-m="${m.k}"><b>${m.name}</b><span>${lab}</span></button>`; }).join('')}</div>`;
}
function boardHTML(x, ans, live){
  let h='<div class="board" id="board">';
  for(let r=0;r<TRIES;r++){
    const g = x.g[r];
    h+=`<div class="row" id="row${r}">`;
    for(let i=0;i<ans.length;i++){
      if(g){ const mk=marks(g,ans); h+=`<span class="tile ${mk[i]}${r===revealRow?' flip':''}" style="${r===revealRow?`animation-delay:${i*90}ms`:''}">${g[i]}</span>`; }
      else if(live && r===x.g.length){ h+=`<span class="tile${cur[i]?' typed':''}">${cur[i]||''}</span>`; }
      else h+=`<span class="tile"></span>`;
    }
    h+='</div>';
  }
  return h+'</div>';
}
function keyState(x, ans){
  const ks={}; const rank={x:0,y:1,g:2};
  x.g.forEach(g=>{ marks(g,ans).forEach((m,i)=>{ const L=g[i]; if(ks[L]===undefined || rank[m]>rank[ks[L]]) ks[L]=m; }); });
  return ks;
}
function bindTabs(){ app.querySelectorAll('.mode').forEach(b=>onPress(b,()=>{ S.mode=b.dataset.m; cur=''; confirmOpen=false; save(); game(); })); }
function game(final){ // final: show the finished board for a moment before Full time (result() follows once)
  const x=st(), m=M(), ans=answerOf(m);
  if(x.over && !final) return result();
  const ks=keyState(x,ans);
  const rows=['QWERTYUIOP','ASDFGHJKL','+ZXCVBNM-'];
  app.innerHTML = `
  <section class="card">
    ${tabs()}
    ${boardHTML(x,ans,true)}
    <div class="status"><span class="eyebrow">${m.name} · ${m.L} letters</span><span class="eyebrow">Guess ${Math.min(x.g.length+1,TRIES)} of ${TRIES}</span></div>
  </section>
  <div class="fb ${fbCls}" id="fb" aria-live="polite">${esc(fbMsg)}</div>
  <div class="kb" aria-label="Keyboard">${rows.map(r=>`<div class="kr">${[...r].map(c=> c==='+'?`<button class="key wide" data-k="ENTER">Enter</button>`: c==='-'?`<button class="key wide" data-k="BACK" aria-label="Delete">Del</button>`:`<button class="key ${ks[c]||''}" data-k="${c}">${c}</button>`).join('')}</div>`).join('')}</div>
  <div id="giveup"></div>`;
  fbMsg=''; fbCls=''; revealRow=-1;
  bindTabs();
  app.querySelectorAll('.key').forEach(k=>onPress(k,()=>press(k.dataset.k)));
  if(!final) drawGiveUp();
}
function drawTyping(){
  const x=st(), r=document.getElementById('row'+x.g.length); if(!r) return;
  [...r.children].forEach((t,i)=>{ t.textContent=cur[i]||''; t.className='tile'+(cur[i]?' typed':''); });
}
/* if the same warning is already showing, the text gives a small shake so a second wrong name is still noticed */
function say(msg,cls){ const f=document.getElementById('fb'); if(f){ const again=!!msg && f.textContent===msg; f.className='fb '+(cls||''); f.textContent=msg; if(again){ void f.offsetWidth; f.classList.add('nudge'); } } }
function press(k){
  const x=st(), m=M(); if(x.over) return;
  if(k==='BACK'){ cur=cur.slice(0,-1); drawTyping(); return; }
  if(k==='ENTER') return submit();
  if(/^[A-Z]$/.test(k) && cur.length<m.L){ cur+=k; drawTyping(); }
}
function submit(){
  const x=st(), m=M(), ans=answerOf(m);
  const rowEl=document.getElementById('row'+x.g.length);
  const shake=()=>{ if(rowEl){ rowEl.classList.remove('shake'); void rowEl.offsetWidth; rowEl.classList.add('shake'); } };
  if(cur.length<m.L){ say(`Not enough letters. This shirt has ${m.L}.`,'warn'); shake(); return; }
  if(x.g.includes(cur)){ say('Already tried that one.','warn'); shake(); return; }
  if(cur!==ans && !VALID[m.L].has(cur)){ say('Not in the squad list. Try another surname.','warn'); shake(); return; }
  x.g.push(cur); x.started=true; revealRow=x.g.length-1; const g=cur; cur='';
  if(g===ans){ x.over=true; x.won=true; save(); game(true); setTimeout(()=>{ if(st()===x) result(); }, 900); return; }
  if(x.g.length>=TRIES){ x.over=true; x.won=false; save(); game(true); setTimeout(()=>{ if(st()===x) result(); }, 900); return; }
  save(); fbMsg = x.g.length===TRIES-1 ? 'Last guess.' : ''; fbCls='warn'; game();
}
addEventListener('keydown', e=>{
  if(!document.getElementById('board') || st().over || e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Enter'){ e.preventDefault(); press('ENTER'); }
  else if(e.key==='Backspace'){ e.preventDefault(); press('BACK'); }
  else if(/^[a-zA-Z]$/.test(e.key)) press(e.key.toUpperCase());
});
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answer.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;const x=st();x.over=true;x.won=false;x.gaveUp=true;save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}

/* ---------- result (per shirt) ---------- */
function verdict(x){
  if(x.gaveUp) return 'Gave up';
  if(!x.won) return 'Shirt stays on the rail';
  return ['','Perfect fit','Off the peg','Tried it on','Took a while','Squeezed in','Last one in the shop'][x.g.length];
}
function inviteUrl(){ return `${GAME_URL}#c${dayNo}-${score(st())}-${M().name.toLowerCase()}`; }
function inviteText(){
  const x=st(), m=M(), ans=answerOf(m), em={g:'🟩',y:'🟨',x:'⬛'};
  const rows=x.g.map(g=>marks(g,ans).map(c=>em[c]).join('')).join('\n');
  const head = x.gaveUp ? `👕 Shirt Swap No. ${dayNo} · ${m.name}: 🏳️ gave up (0/100)` : `👕 Shirt Swap No. ${dayNo} · ${m.name}: ${x.won?x.g.length:'X'}/6 (${score(x)}/100)`;
  return `${head}\n${rows}\n\nGuess the surname on the back of the shirt. Can you do it in fewer?\nTry today's shirt: ${inviteUrl()}`;
}
let cdTimer=0;
function result(){
  const x=st(), m=M(), ans=answerOf(m), s=score(x);
  let vs='';
  if(challenge && challenge.m===m.k){ const d=s-challenge.s; vs=`<div class="vs">Your friend: <b>${challenge.s}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b>, a draw'}</div>`; }
  const others = MODES.filter(o=>!S.modes[o.k].over);
  app.innerHTML = `
  <section class="card enter">
    ${tabs()}
    ${boardHTML(x,ans,false)}
    <div class="inner">
      <div class="reveal"><span class="eyebrow">${x.won?'The shirt was':'It was'}</span><h2>${esc(TODAY[m.L])}</h2></div>
      ${x.gaveUp?'<span class="flag">Gave up</span>':''}
      <div class="score"><b id="scr">0</b><span>/ 100</span></div>
      <p class="verdict">${verdict(x)}</p>
      ${vs}
      ${others.length?`<p class="eyebrow" style="margin:0">${others.map(o=>o.name).join(' and ')} still to play today</p>`:''}
    </div>
  </section>
  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('shirt-swap'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge a friend</h3>
    <img id="cardimg" alt="Shirt Swap share card showing a score of ${s} out of 100">
    <p>Your friend gets today's ${m.name.toLowerCase()} shirt with your score as the one to beat. The card never shows the letters.</p>
    <button class="btn" id="shareBtn">Challenge a friend</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt wa" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">New shirts in</span><b id="cd">--:--:--</b></div>`;
  bindTabs();
  const el=document.getElementById('scr'), t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-t0)/800); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();
  let cardBlob=null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src=URL.createObjectURL(b); });
  const full=inviteText(), url=inviteUrl(), noUrl=full.replace(/\nTry today's shirt: .*$/,'\nTry today\'s shirt:'), E=encodeURIComponent;
  document.getElementById('t-wa').href=`https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href=`https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href=`https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href=`https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto=document.getElementById('sendto');
  const showTargets=()=>{ sendto.hidden=false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    if(!navigator.share) return showTargets();
    const data={title:'Shirt Swap', text:full};
    try{ const f=cardBlob&&new File([cardBlob],`shirt-swap-${dayNo}.png`,{type:'image/png'}); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) data.files=[f]; }catch(e){}
    try{ await navigator.share(data); }catch(e){ if(e&&e.name==='AbortError') return; showTargets(); }
  });
  document.getElementById('copyInvite').addEventListener('click', ()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full; document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it'); };
    try{ navigator.clipboard.writeText(full).then(()=>toast('Invite copied. Paste it to a friend'),fb); }catch(e){ fb(); }
  });
  clearInterval(cdTimer);
  const tick=()=>{const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const d=Math.max(0,(mid-n)/1000|0);
    if(d===0){ clearInterval(cdTimer); return location.reload(); }
    const c=document.getElementById('cd'); if(c) c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tick(); cdTimer=setInterval(tick,1000);
}

/* ---------- share card (1080×1080: colour grid only, never letters) ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const K={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',warn:'#F2B53A',bad:'#FF6B5A',miss:'#3A443E'};
  const cond=v=>{ if('fontStretch' in x) x.fontStretch=v; };
  const s1=st(), m=M(), ans=answerOf(m), Pd=80, s=score(s1);
  x.fillStyle=K.bg; x.fillRect(0,0,W,W);
  cond('condensed'); x.font='900 60px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=K.ink;
  x.fillText('SHIRT',Pd,Pd+50); const w=x.measureText('SHIRT ').width; x.fillStyle=K.acc; x.fillText('SWAP',Pd+w,Pd+50);
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.textAlign='right';
  x.fillText(`NO. ${dayNo} · ${m.name.toUpperCase()} · ${dateLabel.toUpperCase()}`,W-Pd,Pd+46); x.textAlign='left';
  x.fillStyle=K.ink; x.fillRect(Pd,Pd+80,W-2*Pd,4);
  x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.fillText(s1.gaveUp?'I GAVE UP TODAY':s1.won?`I GOT IT IN ${s1.g.length}/6 FOR`:'IT BEAT ME TODAY',Pd,Pd+170);
  cond('condensed'); x.font='900 300px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=K.ink;
  const sw=x.measureText(String(s)).width; x.fillText(String(s),Pd-8,Pd+430);
  cond('normal'); x.font='600 44px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.fillText('/100',Pd+sw+10,Pd+430);
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=(s1.won&&!s1.gaveUp)?K.acc:K.bad; x.fillText(verdict(s1).toUpperCase(),Pd,Pd+500);
  const fill={g:K.acc,y:K.warn,x:K.miss}, gap=8, cell=Math.min(52,(W-Pd-620-6*gap)/7), gx=640, gy=Pd+150;
  for(let r=0;r<TRIES;r++){ const g=s1.g[r]; const mk=g?marks(g,ans):null;
    for(let i=0;i<ans.length;i++){ x.fillStyle=mk?fill[mk[i]]:K.line; x.fillRect(gx+i*(cell+gap), gy+r*(cell+gap), cell, cell); } }
  const by=W-Pd-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=K.ink; x.fillText('CAN YOU NAME THE SHIRT?',Pd,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.fillText('THREE SHIRTS A DAY · 5, 6 AND 7 LETTERS · SIX TRIES',Pd,by);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'));
}

/* ---------- day rollover: always the player's own calendar day. If the page is left open past midnight, load the new day's puzzle when they come back. ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
if(challenge && S.started){ S.mode=challenge.m; }
if(S.started) game(); else intro();
})();
</script>
