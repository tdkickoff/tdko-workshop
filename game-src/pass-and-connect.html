<title>Link Up Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Fast Break family. One narrow column; the passing chain across the top is the pitch, the current player card sits under it. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#0E1712; --muted:#5D6A62; --line:#D7DDD8;
  --accent:#0A8A4A; --accent-ink:#FFFFFF; --warn:#C98A00; --bad:#C93A2B; --soft:#E7ECE8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F; color-scheme:dark}}
:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
main{display:flex;flex-direction:column;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.mark{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:28px;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line)}
.inner{padding:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.diff{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1.5px solid var(--line);color:var(--muted)}
.diff.m{border-color:var(--warn);color:var(--warn)} .diff.h{background:var(--bad);border-color:var(--bad);color:#fff}

/* intro */
.hero{display:flex;flex-direction:column;gap:14px;padding:26px 20px 22px}
.hero h1{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(56px,17vw,96px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 i{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--muted);margin:0;max-width:36ch}
.challenge{border:1.5px solid var(--accent);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.challenge span{font-size:15px}
.challenge b{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.rules li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.rules li>span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.ltag{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;background:var(--soft);color:var(--ink);white-space:nowrap}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder div{padding:10px 4px 9px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.ladder b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.ladder span{font-family:var(--f-mono);font-size:11px;opacity:.85}
.ladder .a{background:var(--accent);color:var(--accent-ink)}
.ladder .b{background:color-mix(in oklab,var(--accent) 50%,var(--bg));color:var(--ink)}
.ladder .c{background:color-mix(in oklab,var(--accent) 22%,var(--bg));color:var(--ink)}
.ladder .d{background:color-mix(in oklab,var(--bad) 22%,var(--bg));color:var(--bad)}

/* buttons */
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;cursor:pointer;background:var(--ink);color:var(--bg);touch-action:manipulation;
  font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:15px 12px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad);color:#fff}
.linkbtn{all:unset;cursor:pointer;align-self:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.linkbtn:hover{color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* chain track */
.track{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto 1fr auto;align-items:center;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.node{width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:17px;border:1.5px dashed var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.node.now{border:2px solid var(--ink);color:var(--ink)}
.node.ok{border:0;background:var(--accent);color:var(--accent-ink)}
.node.foul{border:0;background:color-mix(in oklab,var(--warn) 34%,var(--bg));color:var(--ink)}
.node.miss{border:0;background:color-mix(in oklab,var(--bad) 22%,var(--bg));color:var(--bad)}
.pass{height:2px;background:var(--line);margin:0 4px}
.pass.done{background:var(--accent)}

.status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.lives{display:flex;align-items:center;gap:6px}
.life{width:14px;height:14px;background:var(--accent)}
.life.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.pts{display:flex;align-items:baseline;gap:6px}
.pts b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:36px;line-height:.85;font-variant-numeric:tabular-nums}

.pcard{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{border-left:3px solid var(--ink);padding:10px 14px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.link .from{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.link .from b{color:var(--ink);font-weight:600}
.link p{margin:0;font-weight:700;font-size:17px;line-height:1.3}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px}
.facts span{display:flex;gap:6px;align-items:baseline}
.facts small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;padding:6px 0 2px}
.word{display:flex;gap:3px;align-items:flex-end}
.t{width:clamp(20px,6.4vw,30px);aspect-ratio:4/5;display:grid;place-items:center;border-bottom:2.5px solid var(--ink);
  font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:clamp(16px,4.8vw,22px);line-height:1;text-transform:uppercase}
.t.typed{color:var(--ink)}
.t.hint{color:var(--warn);border-color:var(--warn)}
.t.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.t.sep{width:auto;border:0;color:var(--muted)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hbtn{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;display:inline-flex;gap:10px;align-items:center;
  padding:9px 12px;border:1.5px dashed var(--line);font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hbtn:hover{border-color:var(--warn);border-style:solid}
.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hbtn .c{color:var(--warn)}

.guess{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:1fr auto;gap:8px}
.grow input{box-sizing:border-box;width:100%;min-width:0;font:inherit;font-size:16px;font-weight:500;padding:13px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:0;-webkit-appearance:none}
.grow input:focus{outline:none;border-color:var(--ink)}
.grow input::placeholder{color:var(--muted)}
.grow .btn{padding:0 20px}
.fb{font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;min-height:18px;color:var(--muted)}
.fb.bad{color:var(--bad)} .fb.good{color:var(--accent)} .fb.warn{color:var(--warn)}
.tried{display:flex;flex-wrap:wrap;gap:6px}
.tried span{font-size:13px;padding:3px 8px;background:color-mix(in oklab,var(--bad) 12%,var(--surface));color:var(--bad);text-decoration:line-through}
.confirm{border:1.5px solid var(--bad);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.flag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--bad);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* result */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(88px,26vw,130px);line-height:.82;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:22px;margin:0;text-transform:uppercase}
.vs{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vs b{color:var(--ink)}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chain li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.chain li:first-child{border-top:0}
.chain .node{width:30px;height:30px;font-size:14px}
.chain .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.chain .who b{font-weight:800;font-size:17px;line-height:1.2}
.chain .who small{font-size:14px;color:var(--muted);line-height:1.35}
.share{display:flex;flex-direction:column;gap:10px}
.share h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.share img{display:block;width:100%;max-width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--soft)}
.share p{margin:0;font-size:13px;color:var(--muted)}
.sendto{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgt{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;touch-action:manipulation}
.tgt:hover{border-color:var(--ink)}
.tgt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tgt.wa{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
textarea.copybox{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:13px;background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:10px;min-height:130px}
.next{text-align:center;display:flex;flex-direction:column;gap:2px}
.next b{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;padding:10px 16px;max-width:calc(100% - 40px);text-align:center;z-index:5}

@keyframes fadein{from{opacity:.35}to{opacity:1}}
.enter{animation:fadein .18s ease-out}
@media (max-width:380px){.track{padding-inline:14px}.node{width:32px;height:32px;font-size:15px}.pcard,.status{padding-inline:14px}}
@media (prefers-reduced-motion: reduce){.enter{animation:none}.btn{transition:none}}
.replaying .sharecard{display:none}.replaying header.top::after{content:"Replay · doesn’t count";flex-basis:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark">Link Up <i>Play</i></div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){}
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });
</script>
<script>
(function(){
const GAME_URL = 'https://claude.ai/artifact/N9rCpAVMKXnfZLpw8uHjp9';
const LAUNCH = Date.UTC(2026,10,16);   // SOFT LAUNCH: Mon 16 Nov 2026 is No. 1 (months count from 0). Before that date every day plays No. 1
const LIVES = 5, FOUL = 10;

/* ---------- link types ---------- */
const TYPES = {club:'Club teammates', intl:'International teammates', swap:'Transfer swap', boss:'Manager link', family:'Family', youth:'Boyhood club'};

/* ---------- chains: start player + 4 links. Each link describes how this player connects to the one before. ----------
   p: [name, position, nationality, aliases[], noSurname?]   */
const CHAINS = TDKO_DATA.CHAINS;
const DIFF = {e:'Easy', m:'Medium', h:'Hard'};

/* ---------- day ---------- */
const now = new Date();
const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const dayNo = LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
const C = CHAINS[(dayNo-1) % CHAINS.length];
const PL = [C.start, ...C.links].map((o,i)=>({name:o.p[0], pos:o.p[1], nat:o.p[2], aliases:o.p[3]||[], noSur:!!o.p[4], clubs:o.clubs, t:o.t, x:o.x}));
const N = PL.length;
const dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const REPLAY = tdkoIsReplay('link-up-play', dayKey, dayNo), KEY = 'passconnect:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
if(REPLAY){ tdkoReplayKey = KEY; document.documentElement.classList.add('replaying'); }
const app = document.getElementById('app');
document.getElementById('meta').textContent = `No. ${dayNo} · ${dateLabel}`;
const mh = /^#c(\d+)-(\d{1,3})$/.exec(location.hash);
const challenge = (mh && +mh[1]===dayNo && +mh[2]<=100) ? +mh[2] : null;

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.res)) return s; }catch(e){} return null; }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date> → {gameId: {status, gaveUp}} */
function report(){ if(REPLAY) return; try{ const k='tdko:'+dayKey+'#'+dayNo, all=JSON.parse(localStorage.getItem(k)||'{}'); all['link-up-play']={status: S.over?'done':S.started?'open':'ready', gaveUp:!!S.gaveUp}; localStorage.setItem(k, JSON.stringify(all)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} report(); }
let S = load() || {started:false, idx:0, used:0, res:[], fouls:Array(N).fill(0), hinted:Array(N).fill(false), tried:[], over:false, won:false, gaveUp:false};
// res[i]: 'ok' clean, 'foul' solved after a hint or wrong guess

const solved = () => S.res.length;
function score(){ return S.gaveUp ? 0 : S.won ? 100 - FOUL*S.used : 10*solved(); }
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

/* ---------- matching ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){ const d=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
const slack = s => s.length>=9 ? 2 : s.length>=5 ? 1 : 0;
function isMatch(raw, P){
  const g = norm(raw); if(g.length<3) return false;
  const full = norm(P.name), names=[full, ...P.aliases.map(norm)];
  const parts = full.split(' '), sur = parts.length>1 ? parts.slice(1).join(' ') : null;
  if(names.includes(g) || g.replace(/ /g,'')===full.replace(/ /g,'')) return true;
  if(sur && !P.noSur && g===sur) return true;
  if(names.some(n => lev(g,n) <= slack(n))) return true;
  return !!(sur && !P.noSur && sur.length>=6 && lev(g,sur) <= slack(sur));
}

/* ---------- tiles ---------- */
function hintSet(name){ // first letter of each word, plus one more in longer words
  const set=new Set(); let k=0;
  name.split(' ').forEach(w=>{ const letters=[...w]; letters.forEach((ch,i)=>{ if(/\p{L}/u.test(ch)){ if(i===0) set.add(k+i); } });
    if(letters.length>=5){ const mid=Math.floor(letters.length/2); if(/\p{L}/u.test(letters[mid])) set.add(k+mid); }
    k+=letters.length+1; });
  return set;
}
function tilesHTML(name, mode, typed){ // mode: 'blank' | 'hint' | 'ok'
  const hs = mode==='hint' ? hintSet(name) : new Set();
  const typedLetters = [...(typed||'').replace(/[^\p{L}]/gu,'')];
  let k=0, li=0;
  return `<div class="tiles" aria-hidden="true">${name.split(' ').map(w=>`<div class="word">${[...w].map(ch=>{
    const idx=k++; if(!/\p{L}/u.test(ch)) return `<span class="t sep">${esc(ch)}</span>`;
    let cls='t', show='';
    if(mode==='ok'){ cls+=' ok'; show=ch; }
    else if(typedLetters[li]){ cls+=' typed'; show=typedLetters[li]; }
    else if(hs.has(idx)){ cls+=' hint'; show=ch; }
    li++;
    return `<span class="${cls}">${esc(show)}</span>`; }).join('')}</div>${(k++,'')}`).join('')}</div>`;
}

/* A press acts on pointerdown. After a touch, the browser's follow-up click is swallowed so it can't land on
   whatever the new screen put under the finger; with a mouse, the same element ignores its own follow-up click. */
let swallowUntil = 0;
document.addEventListener('pointerdown', ()=>{ swallowUntil = 0; }, true);
document.addEventListener('click', e=>{ if(performance.now() < swallowUntil){ swallowUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
function onPress(el, fn){
  let fired = false;
  const off = () => el.disabled || el.getAttribute('aria-disabled')==='true';
  el.addEventListener('pointerdown', e=>{ if(e.button!==0 || off()) return; e.preventDefault();
    if(e.pointerType==='mouse') fired = true; else swallowUntil = performance.now() + 600; fn(); });
  el.addEventListener('click', ()=>{ if(fired){ fired=false; return; } if(!off()) fn(); }); // keyboard Enter/Space
}
let tt=0;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- intro ---------- */
function intro(){
  app.innerHTML = `
  <section class="card enter"><div class="hero">
    <h1>Link Up<br><i>Play</i></h1>
    <p class="lede">Five footballers, each linked to the next. Name them in order and complete the passing move.</p>
    ${challenge!==null?`<div class="challenge"><span>A friend scored this on today's chain. Can you beat them?</span><b>${challenge}</b></div>`:''}
    <ul class="rules">
      <li><span>Clues</span>Each player's position, nationality and how he links to the last one</li>
      <li><span>Lives</span>Five for the whole chain. A wrong guess or a letter hint costs one</li>
      <li><span>Score</span>Complete the chain for 100, minus 10 per life lost. Run out and you get 10 per player named</li>
    </ul>
    <div class="types" aria-label="Kinds of link">${Object.values(TYPES).map(t=>`<span class="ltag">${t}</span>`).join('')}</div>
    <div class="ladder" aria-label="Points">
      <div class="a"><b>100</b><span>Clean</span></div><div class="b"><b>80</b><span>2 lives lost</span></div><div class="c"><b>60</b><span>4 lives lost</span></div><div class="d"><b>0–40</b><span>Broken</span></div>
    </div>
    <button class="btn" id="go">Kick off the move</button>
  </div></section>`;
  onPress(document.getElementById('go'), ()=>{ S.started=true; save(); game(); });
}

/* ---------- game ---------- */
let confirmOpen=false, fbMsg='', fbCls='';
function track(cur){
  return `<div class="track" aria-label="Chain progress">${PL.map((p,i)=>{
    const r=S.res[i];
    const cls = r ? r : (S.over ? 'miss' : i===cur ? 'now' : '');
    const label = r ? initials(p.name) : String(i+1);
    return `${i?`<span class="pass ${i<=solved()&&S.res[i-1]?'done':''}"></span>`:''}<span class="node ${cls}" title="${r?esc(p.name):'Player '+(i+1)}">${label}</span>`;
  }).join('')}</div>`;
}
function game(){
  if(S.over) return result();
  const i=S.idx, P=PL[i], prev=PL[i-1];
  app.innerHTML = `
  <section class="card">
    ${track(i)}
    <div class="status">
      <div class="lives" aria-label="${LIVES-S.used} lives left"><span class="eyebrow" style="margin-right:4px">Lives</span>${Array.from({length:LIVES},(_,k)=>`<span class="life${k>=LIVES-S.used?' used':''}"></span>`).join('')}</div>
      <div class="pts"><span class="eyebrow">Named</span><b>${solved()}/${N}</b></div>
    </div>
    <div class="pcard">
      <div class="phead"><span class="eyebrow">Player ${i+1} of ${N}${i===0?' · The kick-off':''}</span>${i?`<span class="ltag">${TYPES[P.t]}</span>`:''}</div>
      ${i ? `<div class="link"><span class="from">Linked to <b>${esc(prev.name)}</b></span><p>${esc(P.x)}</p></div>`
          : `<div class="link"><span class="from">His clubs</span><p>${esc(P.clubs)}</p></div>`}
      <div class="facts"><span><small>Position</small><b>${esc(P.pos)}</b></span><span><small>Nationality</small><b>${esc(P.nat)}</b></span></div>
      <div id="tiles">${tilesHTML(P.name, S.hinted[i]?'hint':'blank','')}</div>
      <div class="prow">
        ${S.hinted[i] ? `<span class="eyebrow">Letters shown</span>` : `<button class="hbtn" id="hint">Show letters <span class="c">−1 life</span></button>`}
        <span class="eyebrow">${[...P.name].filter(c=>/\p{L}/u.test(c)).length} letters</span>
      </div>
    </div>
  </section>
  <form class="guess" id="gform" autocomplete="off">
    <div class="grow">
      <input id="gin" type="text" autocapitalize="words" spellcheck="false" placeholder="Name player ${i+1}" aria-label="Your guess for player ${i+1}">
      <button class="btn" type="submit" id="gbtn">Pass</button>
    </div>
    <div class="fb ${fbCls}" id="fb">${esc(fbMsg)}</div>
    ${S.tried.length?`<div class="tried" aria-label="Wrong guesses for this player">${S.tried.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
  </form>
  <div id="giveup"></div>`;
  fbMsg=''; fbCls='';
  const inp=document.getElementById('gin');
  inp.addEventListener('input', ()=>{ document.getElementById('tiles').innerHTML = tilesHTML(P.name, S.hinted[i]?'hint':'blank', inp.value); });
  document.getElementById('gform').addEventListener('submit', e=>{ e.preventDefault(); guess(); });
  const hb=document.getElementById('hint'); if(hb) onPress(hb, useHint);
  drawGiveUp();
}
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answer.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;S.over=true;S.gaveUp=true;save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}
function loseLife(){
  S.used++; S.fouls[S.idx]++;
  if(S.used>=LIVES){ S.over=true; save(); result(); return true; }
  return false;
}
function useHint(){
  if(S.over || S.hinted[S.idx]) return;
  S.hinted[S.idx]=true;
  if(loseLife()) return;
  save(); fbMsg='Letters shown. One life used.'; fbCls='warn'; game();
}
function guess(){
  const inp=document.getElementById('gin'), raw=inp.value.trim(); if(!raw) return;
  const P=PL[S.idx];
  if(isMatch(raw,P)){
    S.res[S.idx] = S.fouls[S.idx] ? 'foul' : 'ok';
    document.getElementById('tiles').innerHTML = tilesHTML(P.name,'ok');
    const f=document.getElementById('fb'); f.className='fb good'; f.textContent=`${P.name}. Pass complete.`;
    inp.disabled=true; document.getElementById('gbtn').disabled=true;
    S.tried=[];
    if(S.idx===N-1){ S.over=true; S.won=true; save(); setTimeout(result,700); return; }
    S.idx++; save(); setTimeout(game,700); return;
  }
  if(S.tried.some(t=>norm(t)===norm(raw))){ const f=document.getElementById('fb'); f.className='fb warn'; f.textContent='Already tried that one. No life lost.'; inp.select(); return; }
  S.tried.push(raw);
  if(loseLife()) return;
  save();
  const left=LIVES-S.used;
  fbMsg = left===1 ? 'Not him. Last life left.' : `Not him. ${left} lives left.`; fbCls = left===1?'warn':'bad';
  game(); document.getElementById('gin').focus({preventScroll:true});
}

/* ---------- result ---------- */
function verdict(s){
  if(S.won){ if(s===100) return 'Total football'; if(s>=80) return 'Slick passing move'; return 'Got there, just'; }
  if(S.gaveUp) return 'Gave up';
  return solved()>=3 ? 'Cut out in the final third' : 'Possession lost';
}
const nodeCls = i => S.res[i] || 'miss';
function inviteUrl(){ return `${GAME_URL}#c${dayNo}-${score()}`; }
function inviteText(){
  const sq={ok:'🟩',foul:'🟨',miss:'🟥'};
  const row = PL.map((_,i)=>sq[nodeCls(i)]).join('➡️');
  const head = S.won ? `⚽ Link Up Play No. ${dayNo}: completed the move for ${score()}/100` : (S.gaveUp ? `⚽ Link Up Play No. ${dayNo}: 🏳️ gave up (0/100)` : `⚽ Link Up Play No. ${dayNo}: move broken down at ${solved()}/${N}`);
  return `${head}\n${row}\n\nFive footballers, each linked to the next. Can you complete today's chain?\nTry it: ${inviteUrl()}`;
}
let cdTimer=0;
function result(){
  const s=score();
  let vs='';
  if(challenge!==null){ const d=s-challenge; vs=`<div class="vs">Your friend: <b>${challenge}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b>, a draw'}</div>`; }
  app.innerHTML = `
  <section class="card enter">
    ${track(-1)}
    <div class="inner">
      <span class="eyebrow">Full time · No. ${dayNo}</span>
      ${S.gaveUp?'<span class="flag">Gave up</span>':''}
      <div class="score"><b id="scr">0</b><span>/ 100</span></div>
      <p class="verdict">${verdict(s)}</p>
      ${vs}
      <ol class="chain">${PL.map((p,i)=>`<li><span class="node ${nodeCls(i)}">${i+1}</span><div class="who"><b>${esc(p.name)}</b><small>${i?`<span class="ltag">${TYPES[p.t]}</span> ${esc(p.x)}`:esc(p.clubs)}</small></div></li>`).join('')}</ol>
    </div>
  </section>
  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('link-up-play'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge a friend</h3>
    <img id="cardimg" alt="Link Up Play share card showing a score of ${s} out of 100">
    <p>Your friend gets today's chain with your score as the one to beat. The card never shows the players.</p>
    <button class="btn" id="shareBtn">Challenge a friend</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt wa" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">Next chain in</span><b id="cd">--:--:--</b></div>`;

  const el=document.getElementById('scr'), t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-t0)/800); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();

  let cardBlob=null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src=URL.createObjectURL(b); });

  const full=inviteText(), url=inviteUrl(), noUrl=full.replace(/\nTry it: .*$/,'\nTry it:'), E=encodeURIComponent;
  document.getElementById('t-wa').href=`https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href=`https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href=`https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href=`https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto=document.getElementById('sendto');
  const showTargets=()=>{ sendto.hidden=false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    if(!navigator.share) return showTargets();
    const data={title:'Link Up Play', text:full};
    try{ const f=cardBlob&&new File([cardBlob],`link-up-play-${dayNo}.png`,{type:'image/png'}); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) data.files=[f]; }catch(e){}
    try{ await navigator.share(data); }catch(e){ if(e&&e.name==='AbortError') return; showTargets(); }
  });
  document.getElementById('copyInvite').addEventListener('click', ()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full; document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it'); };
    try{ navigator.clipboard.writeText(full).then(()=>toast('Invite copied. Paste it to a friend'),fb); }catch(e){ fb(); }
  });

  clearInterval(cdTimer);
  const tick=()=>{const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const d=Math.max(0,(mid-n)/1000|0);
    if(d===0){ clearInterval(cdTimer); return location.reload(); }
    const c=document.getElementById('cd'); if(c) c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tick(); cdTimer=setInterval(tick,1000);
}

/* ---------- share card (1080×1080, shows the chain shape, never the names) ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const K={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',accInk:'#06120B',warn:'#F2B53A',bad:'#FF6B5A'};
  const cond=v=>{ if('fontStretch' in x) x.fontStretch=v; };
  const Pd=80, s=score();
  x.fillStyle=K.bg; x.fillRect(0,0,W,W);
  x.strokeStyle=K.line; x.lineWidth=4; x.beginPath(); x.arc(W+40,W*0.42,300,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W-260,0); x.lineTo(W-260,W); x.stroke();
  cond('condensed'); x.font='900 60px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=K.ink;
  x.fillText('LINK UP',Pd,Pd+50); const w=x.measureText('LINK UP ').width; x.fillStyle=K.acc; x.fillText('PLAY',Pd+w,Pd+50);
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.textAlign='right';
  x.fillText(`NO. ${dayNo} · ${dateLabel.toUpperCase()}`,W-Pd,Pd+46); x.textAlign='left';
  x.fillStyle=K.ink; x.fillRect(Pd,Pd+80,W-2*Pd,4);
  x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.fillText(S.won?'I COMPLETED THE MOVE FOR':S.gaveUp?'I GAVE UP TODAY':`MOVE BROKEN DOWN AT ${solved()}/${N}`,Pd,Pd+170);
  cond('condensed'); x.font='900 340px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=K.ink;
  const sw=x.measureText(String(s)).width; x.fillText(String(s),Pd-8,Pd+460);
  cond('normal'); x.font='600 48px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.fillText('/100',Pd+sw+10,Pd+460);
  cond('condensed'); x.font='800 52px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=S.won?K.acc:K.bad; x.fillText(verdict(s).toUpperCase(),Pd,Pd+540);
  // chain
  const fill={ok:K.acc,foul:K.warn,miss:K.bad}, nd=96, span=(W-2*Pd-nd)/(N-1), cy=Pd+650;
  for(let i=1;i<N;i++){ x.fillStyle=(S.res[i-1]&&S.res[i])?K.acc:K.line; x.fillRect(Pd+(i-1)*span+nd/2, cy-3, span, 6); }
  PL.forEach((_,i)=>{ const cx=Pd+i*span; x.fillStyle=fill[nodeCls(i)]; x.fillRect(cx,cy-nd/2,nd,nd);
    cond('condensed'); x.font='800 48px Archivo,sans-serif'; x.textAlign='center'; x.fillStyle=K.bg; x.fillText(String(i+1),cx+nd/2,cy+17); x.textAlign='left'; });
  const by=W-Pd-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=K.ink; x.fillText('CAN YOU COMPLETE THE CHAIN?',Pd,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=K.muted; x.fillText('5 FOOTBALLERS · EACH LINKED TO THE NEXT',Pd,by);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'));
}

/* ---------- day rollover: always the player's own calendar day. If the page is left open past midnight, load the new day's puzzle when they come back. ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
if(S.over) result(); else if(S.started) game(); else intro();
})();
</script>
