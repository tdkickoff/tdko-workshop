<title>Fast Break</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column, a single "card" that is the pitch; everything else is chalk-line quiet. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#0E1712; --muted:#5D6A62; --line:#D7DDD8;
  --accent:#0A8A4A; --accent-ink:#FFFFFF; --warn:#C98A00; --bad:#C93A2B; --soft:#E7ECE8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F; color-scheme:dark}}
:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{display:flex;flex-direction:column;gap:14px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.mark{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:28px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.mark i{font-style:normal;color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;text-align:right}

/* progress strip: thin = easy, mid = medium, tall = hard */
.strip{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;align-items:end}
.strip span{height:5px;background:var(--line)}
.strip span.m{height:8px} .strip span.h{height:12px}
.strip span.now{background:var(--ink)}
.strip span[data-p="5"]{background:var(--accent)}
.strip span[data-p="4"]{background:color-mix(in oklab,var(--accent) 80%,var(--bg))}
.strip span[data-p="3"]{background:color-mix(in oklab,var(--accent) 60%,var(--bg))}
.strip span[data-p="2"]{background:color-mix(in oklab,var(--accent) 42%,var(--bg))}
.strip span[data-p="1"]{background:color-mix(in oklab,var(--accent) 28%,var(--bg))}
.strip span[data-p="0"]{background:var(--bad)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.clock{height:4px;background:var(--soft)}
.clock b{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}
.clock b.late{background:var(--warn)}
.clock b.dead{background:var(--bad)}
.inner{padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qtag{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1.5px solid var(--line);color:var(--muted)}
.lvl.m{border-color:var(--warn);color:var(--warn)}
.lvl.h{background:var(--bad);border-color:var(--bad);color:#fff}
.secs{font-family:var(--f-mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.secs.late{color:var(--warn)} .secs.dead{color:var(--bad)}
.question{font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:clamp(22px,5.6vw,28px);line-height:1.15;margin:0;text-wrap:balance;min-height:2.3em}

.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;
  padding:13px 14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;font-weight:500;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{font-family:var(--f-mono);font-size:12px;font-weight:600;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted)}
.opt .pts{font-family:var(--f-mono);font-weight:600;font-size:14px}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--ink)}
.opt.right{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
.opt.right .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,var(--surface))}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.fade{opacity:.45}

.foot{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.foot strong{color:var(--ink);font-size:15px}

/* intro */
.hero{display:flex;flex-direction:column;gap:14px;padding:26px 20px 22px}
.hero h1{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(60px,19vw,104px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 i{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--muted);margin:0;max-width:34ch}
.challenge{border:1.5px solid var(--accent);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.challenge span{font-size:15px}
.challenge b{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.fbmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fbmode{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:1.5px solid var(--line);text-align:center}
.fbmode b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;line-height:1}
.fbmode span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
.fbmode.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}.fbmode.on span{color:inherit;opacity:.8}
.fbmode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ladder div{padding:10px 2px 9px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.ladder b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:24px;line-height:1}
.ladder span{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap}
.ladder [data-p="5"]{background:var(--accent);color:var(--accent-ink)}
.ladder [data-p="4"]{background:color-mix(in oklab,var(--accent) 78%,var(--bg));color:var(--accent-ink)}
.ladder [data-p="3"]{background:color-mix(in oklab,var(--accent) 55%,var(--bg));color:var(--ink)}
.ladder [data-p="2"]{background:color-mix(in oklab,var(--accent) 36%,var(--bg));color:var(--ink)}
.ladder [data-p="1"]{background:color-mix(in oklab,var(--accent) 20%,var(--bg));color:var(--ink)}
.ladder [data-p="0"]{background:color-mix(in oklab,var(--bad) 22%,var(--bg));color:var(--bad)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.rules li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.rules li>span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}

.btn{all:unset;box-sizing:border-box;display:block;text-align:center;cursor:pointer;background:var(--ink);color:var(--bg);touch-action:manipulation;
  font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:15px 12px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase}

/* result */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(96px,30vw,150px);line-height:.82;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:22px;margin:0;text-transform:uppercase}
.vs{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vs b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid i{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--line);color:var(--muted)}
.grid i[data-p="5"]{background:var(--accent);color:var(--accent-ink)}
.grid i[data-p="4"]{background:color-mix(in oklab,var(--accent) 78%,var(--bg));color:var(--accent-ink)}
.grid i[data-p="3"]{background:color-mix(in oklab,var(--accent) 55%,var(--bg));color:var(--ink)}
.grid i[data-p="2"]{background:color-mix(in oklab,var(--accent) 36%,var(--bg));color:var(--ink)}
.grid i[data-p="1"]{background:color-mix(in oklab,var(--accent) 20%,var(--bg));color:var(--ink)}
.grid i[data-p="0"]{background:color-mix(in oklab,var(--bad) 22%,var(--bg));color:var(--bad)}

.share{display:flex;flex-direction:column;gap:10px}
.share h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.share img{display:block;width:100%;max-width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--soft)}
.share p{margin:0;font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.danger{background:var(--bad);color:#fff}
.confirm{border:1.5px solid var(--bad);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.flag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--bad);color:#fff}
.answers{border-top:1px solid var(--line);padding-top:12px}
.answers summary{cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.answers ol{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.answers li b{display:block;color:var(--accent)}
.answers li small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sendto{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgt{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;touch-action:manipulation;transition:border-color .1s,background .1s}
.tgt:hover{border-color:var(--ink)}
.tgt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#t-wa{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
.linkbtn{all:unset;cursor:pointer;align-self:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.linkbtn:hover{color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea.copybox{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:13px;background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:10px;min-height:130px}
.next{text-align:center;display:flex;flex-direction:column;gap:2px}
.next b{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;padding:10px 16px;max-width:calc(100% - 40px);text-align:center}

/* countdown */
.count{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:44px 20px 40px;text-align:center;min-height:360px;box-sizing:border-box}
.count .num{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(150px,48vw,230px);line-height:.8;font-variant-numeric:tabular-nums;color:var(--ink)}
.count .num.go{color:var(--accent)}
.count .call{font-family:var(--f-display);font-weight:800;font-stretch:82%;font-size:clamp(26px,7vw,36px);line-height:1.05;text-transform:uppercase;margin:0;text-wrap:balance;min-height:2.1em;display:flex;align-items:center}
.count .ticks{display:flex;gap:6px}
.count .ticks span{width:28px;height:4px;background:var(--line)}
.count .ticks span.on{background:var(--accent)}
@keyframes pop{from{transform:scale(1.25);opacity:.2}to{transform:none;opacity:1}}
.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
@keyframes fadein{from{opacity:.35}to{opacity:1}}
.enter{animation:fadein .18s ease-out}
@media (prefers-reduced-motion: reduce){.enter{animation:none}.opt,.btn{transition:none}}
.replaying .sharecard{display:none}.replaying header.top::after{content:"Replay · doesn’t count";flex-basis:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark">Fast<i>·</i>Break</div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="strip" id="strip" aria-hidden="true"></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){}
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });
</script>
<script>
(function(){
const GAME_URL = 'https://claude.ai/artifact/GTEX6S4QVDHDftrakpgRTk';

/* ---------- questions: [question, options (first is correct), tier]; options are shuffled at render ---------- */
const Q = TDKO_DATA.Q;
/* Fixed daily sets (indexes into Q): 10 easy, 9 medium, 1 hard. Scheduled so no player named here appears in any other game on the same day. */
const DAYS = TDKO_DATA.DAYS;
const TIERS = {e:'Easy', m:'Medium', h:'Hard'};

const QN = 20, LAUNCH = Date.UTC(2026,10,16);   // SOFT LAUNCH: Mon 16 Nov 2026 is No. 1 (months count from 0). Before that date every day plays No. 1
/* Modes (TEST ONLY for now: testers pick Easy / Medium / Hard; everyone else plays Hard, the original game).
   Every mode is out of 100: points come from how fast you answer (5 within 2s, 4 within 4s, 3 within 6s, 2 within 8s),
   and any correct answer after that, up to the mode's clock, scores 1. */
const FB_MODES = {hard:{lim:10,name:'Hard'}, medium:{lim:15,name:'Medium'}, easy:{lim:20,name:'Easy'}};
const MODES_ON = !!window.TDKO_TEST;
let LIMIT = 10;
const modeKey = () => MODES_ON && state && FB_MODES[state.mode] ? state.mode : 'hard';
const setMode = () => { LIMIT = FB_MODES[modeKey()].lim; };
const app = document.getElementById('app'), strip = document.getElementById('strip'), meta = document.getElementById('meta');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- session state ---------- */
let dayKey='', dayNo=1, dateLabel='', QUIZ=[], state=null, KEY='', challenge=null;
let REPLAY=false, raf=0, cdTimer=0, advanceTimer=0, keyHandler=null, confirmOpen=false;

function setup(){
  const now = new Date();
  dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  dayNo = LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
  dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const rand = rng(hash('fastbreak:'+dayKey));
  const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const make = i => { const [q,opts,t]=Q[i]; const order=shuffle([0,1,2,3]); return {q,t,opts:order.map(k=>opts[k]),correct:order.indexOf(0)}; };
  const d = (dayNo-1) % DAYS.length;
  {
    // DAYS[d].o is a fixed order (easy, then medium, then hard) with no two questions of the same type, or with the same answer, back to back
    QUIZ = (DAYS[d].o || [...shuffle(DAYS[d].e), ...shuffle(DAYS[d].m), ...DAYS[d].h]).map(make);
  }
  REPLAY = tdkoIsReplay('fast-break', dayKey, dayNo);
  KEY = 'fastbreak:v2:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
  if(REPLAY) tdkoReplayKey = KEY;
  document.documentElement.classList.toggle('replaying', REPLAY);
  state = load() || {results:[], seen:-1, done:false};
  setMode();
  if(!state.done && state.seen >= state.results.length){ state.results.push({pts:0,t:LIMIT,ok:false}); save(); }
  if(state.results.length >= QN) state.done = true;
  meta.textContent = `No. ${dayNo} · ${dateLabel}`;
  // challenge link: #c<day>-<score>
  const m = /^#c(\d+)-(\d{1,3})$/.exec(location.hash);
  challenge = (m && +m[1]===dayNo && +m[2]<=100) ? +m[2] : null;
}
function load(){ try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null} }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date> → {gameId: {status, gaveUp}} */
function report(){ if(REPLAY) return; try{ const k='tdko:'+dayKey+'#'+dayNo, all=JSON.parse(localStorage.getItem(k)||'{}'); all['fast-break']={status: state.done?'done':(state.results.length||state.seen>=0)?'open':'ready', gaveUp:!!state.gaveUp}; localStorage.setItem(k, JSON.stringify(all)); }catch(e){} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} report(); }
function total(){return state.gaveUp ? 0 : state.results.reduce((a,r)=>a+r.pts,0)}
function stopAll(){ cancelAnimationFrame(raf); clearInterval(cdTimer); clearTimeout(advanceTimer); if(keyHandler){removeEventListener('keydown',keyHandler); keyHandler=null;} }

function drawStrip(cur){
  strip.innerHTML = QUIZ.map((Q,i)=>{
    const r=state.results[i], tier=Q.t==='e'?'':Q.t;
    return r?`<span class="${tier}" data-p="${r.pts}"></span>`:`<span class="${tier}${i===cur?' now':''}"></span>`}).join('');
}

/* Fire on press, not release: an answer registers the instant a finger or mouse goes down. */
/* A press acts on pointerdown. After a touch, the browser's follow-up click is swallowed so it can't land on
   whatever the new screen put under the finger; with a mouse, the same element ignores its own follow-up click. */
let swallowUntil = 0;
document.addEventListener('pointerdown', ()=>{ swallowUntil = 0; }, true);
document.addEventListener('click', e=>{ if(performance.now() < swallowUntil){ swallowUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
function onPress(el, fn){
  let fired = false;
  const off = () => el.disabled || el.getAttribute('aria-disabled')==='true';
  el.addEventListener('pointerdown', e=>{ if(e.button!==0 || off()) return; e.preventDefault();
    if(e.pointerType==='mouse') fired = true; else swallowUntil = performance.now() + 600; fn(); });
  el.addEventListener('click', ()=>{ if(fired){ fired=false; return; } if(!off()) fn(); }); // keyboard Enter/Space
}

  </div></section>`;
  const go = document.getElementById('go');
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{ state.mode=b.dataset.mode; setMode(); save(); intro(); }));
  onPress(go, () => countdown(state.results.length));

/* ---------- 5-second countdown ---------- */
const CALLS = [
  ["Switch on.","Wake up.","Eyes on the ball.","Come on.","Let's go!"],
  ["Boots laced.","Shin pads in.","Heads up.","First touch counts.","Let's go!"],
  ["Phone down.","Head in the game.","Stay sharp.","Quick feet, quick mind.","Let's go!"],
  ["Tunnel's quiet.","Hear the crowd.","No passengers today.","Win every second ball.","Let's go!"],
  ["Captains shake hands.","Find your shape.","Concentrate.","Whistle's coming.","Let's go!"],
  ["Lock in.","No distractions.","Read the play.","Be first to it.","Let's go!"]
];
function countdown(startAt){
  stopAll(); drawStrip(-1);
  const lines = CALLS[Math.floor(Math.random()*CALLS.length)];
  const Q = QUIZ[startAt];
  app.innerHTML = `
  <section class="card"><div class="count">
    <span class="eyebrow">Kick-off in</span>
    <div class="num" id="cnum" aria-live="assertive">5</div>
    <p class="call" id="ccall"></p>
    <div class="ticks" aria-hidden="true">${'<span></span>'.repeat(5)}</div>
    <span class="eyebrow">Up first: Q${String(startAt+1).padStart(2,'0')} · ${TIERS[Q.t]}</span>
  </div></section>`;
  const num=document.getElementById('cnum'), call=document.getElementById('ccall'), ticks=[...app.querySelectorAll('.ticks span')];
  let n = 5;
  const step = () => {
    if(n===0){ return ask(startAt); }
    num.textContent = n; num.className = 'num pop' + (n===1?' go':'');
    call.textContent = lines[5-n]; call.className = 'call pop';
    ticks.forEach((t,i)=>t.classList.toggle('on', i < 6-n));
    void num.offsetWidth;
    n--; advanceTimer = setTimeout(step, 1000);
  };
  step();
}

/* ---------- question ---------- */
function ask(i){
  stopAll();
  if(i >= QN){ state.done=true; save(); return result(); }
  const Q = QUIZ[i]; let locked=false;
  state.seen = i; save();
  drawStrip(i);
  app.innerHTML = `
  <section class="card">
    <div class="clock"><b id="bar"></b></div>
    <div class="inner">
      <div class="qhead">
        <div class="qtag"><span class="eyebrow">${i===QN-1?'Final question':'Question '+String(i+1).padStart(2,'0')+' / '+QN}</span><span class="lvl ${Q.t==='e'?'':Q.t}">${TIERS[Q.t]}</span></div>
        <span class="secs" id="secs">10.0</span>
      </div>
      <h2 class="question enter">${esc(Q.q)}</h2>
      <div class="opts">${Q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span><span class="pts"></span></button>`).join('')}</div>
    </div>
  </section>
  <div class="foot"><span>Score <strong>${total()}</strong> / 100</span><span>${QN-i-1===0?'Last one':(QN-i-1)+' to go'}</span></div>
  <div id="giveup"></div>`;
  drawGiveUp();
  const bar=document.getElementById('bar'), secs=document.getElementById('secs'), btns=[...app.querySelectorAll('.opt')];
  const t0 = performance.now();
  let lastCls = null;
  const tick = () => {
    const left = Math.max(0, LIMIT - (performance.now()-t0)/1000);
    bar.style.transform = `scaleX(${left/LIMIT})`;
    secs.textContent = left.toFixed(1);
    const cls = left<=2?'dead':left<=4?'late':'';
    if(cls!==lastCls){ bar.className = cls; secs.className = 'secs '+cls; lastCls=cls; }
    if(left<=0){ answer(-1); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  btns.forEach(b=>onPress(b, ()=>answer(+b.dataset.k)));
  keyHandler = e => {
    if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
    if(m!==undefined){ e.preventDefault(); answer(m); }
  };
  addEventListener('keydown',keyHandler);

  function answer(k){
    if(locked) return; locked=true;
    const elapsed = k<0 ? LIMIT : (performance.now()-t0)/1000;
    cancelAnimationFrame(raf);
    const left = Math.max(0, LIMIT-elapsed), ok = k===Q.correct;
    const pts = ok ? Math.min(5, Math.max(1, Math.ceil((10-elapsed)/2))) : 0;   // speed bands are the same in every mode
    state.results.push({pts, t:+Math.min(elapsed,LIMIT).toFixed(2), ok}); save();
    btns.forEach((b,j)=>{ b.disabled=true;
      if(j===Q.correct){ b.classList.add('right'); if(ok) b.querySelector('.pts').textContent='+'+pts; }
      else if(j===k){ b.classList.add('wrong'); b.querySelector('.pts').textContent='0'; }
      else b.classList.add('fade'); });
    if(k<0){ secs.textContent='0.0'; bar.style.transform='scaleX(0)'; app.querySelector('.qtag .eyebrow').textContent='Time up'; }
    drawStrip(-1);
    app.querySelector('.foot strong').textContent = total();
    advanceTimer = setTimeout(()=>ask(i+1), ok?850:1500);
  }
}

/* ---------- give up: confirm, then end on 0 and reveal the answers ---------- */
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answer.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;stopAll();state.gaveUp=true;state.done=true;save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}

/* ---------- result ---------- */
function verdict(s){
  if(state.gaveUp) return 'Gave up';
  if(s>=90) return 'Ballon d’Or form';
  if(s>=75) return 'Man of the match';
  if(s>=60) return 'Solid ninety minutes';
  if(s>=40) return 'Mid-table finish';
  if(s>=20) return 'Off the bench, off the pace';
  return 'Relegation scrap';
}
function inviteUrl(){ return `${GAME_URL}#c${dayNo}-${total()}`; }
function inviteText(){
  const sq = p => p===0?'🟥':p>=4?'🟩':'🟨';
  const all = Array.from({length:QN},(_,i)=>state.results[i]);
  const rows = [all.slice(0,10),all.slice(10,20)].map(r=>r.map(x=>x?sq(x.pts):'⬜').join('')).join('\n');
  return `⚡ Fast Break No. ${dayNo}${MODES_ON?' · '+FB_MODES[modeKey()].name:''}: ${state.gaveUp?'🏳️ gave up (0/100)':`I scored ${total()}/100`}\n${rows}\n\nThink you're quicker? 20 football questions, ${LIMIT} seconds each, one go a day.\nBeat my score: ${inviteUrl()}`;
}

function result(){
  stopAll(); drawStrip(-1);
  const s = total(), right = state.results.filter(r=>r.ok);
  const avg = right.length ? (right.reduce((a,r)=>a+r.t,0)/right.length).toFixed(1)+'s' : '—';
  let vs = '';
  if(challenge!==null){
    const d = s - challenge;
    vs = `<div class="vs">Your friend: <b>${challenge}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b> — a draw'}</div>`;
  }
  app.innerHTML = `
  <section class="card enter"><div class="inner">
    <span class="eyebrow">Full time · No. ${dayNo}${MODES_ON?' · '+FB_MODES[modeKey()].name:''}</span>
    ${state.gaveUp?'<span class="flag">Gave up</span>':''}
    <div class="score"><b id="sc">0</b><span>/ 100</span></div>
    <p class="verdict">${verdict(s)}</p>
    ${vs}
    <div class="stats">
      <div><b>${right.length}/${QN}</b><span>Correct</span></div>
      <div><b>${avg}</b><span>Avg answer</span></div>
      <div><b>${state.results.filter(r=>r.pts===5).length}</b><span>Full 5s</span></div>
    </div>
    <div class="grid" aria-label="Points per question">${Array.from({length:QN},(_,i)=>{const r=state.results[i]; return r?`<i data-p="${r.pts}" title="Q${i+1}: ${r.pts} pts">${r.pts}</i>`:`<i title="Q${i+1}: not reached">–</i>`;}).join('')}</div>
    <details class="answers"${state.gaveUp?' open':''}><summary>${state.gaveUp?'The answers':'See all 20 answers'}</summary><ol>${QUIZ.map((q,i)=>{const r=state.results[i]; return `<li>${esc(q.q)}<b>${esc(q.opts[q.correct])}</b><small>${r?(r.ok?`You got it · ${r.pts} pts`:'Missed · 0 pts'):'Not reached'}</small></li>`;}).join('')}</ol></details>
  </div></section>

  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('fast-break'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge a friend</h3>
    <img id="cardimg" alt="Fast Break share card showing a score of ${s} out of 100">
    <p>Your friend gets today's quiz with your score as the one to beat.</p>
    <button class="btn" id="shareBtn">Challenge a friend</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">Next kick-off in</span><b id="cd">--:--:--</b></div>`;

  const el=document.getElementById('sc'), start=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-start)/900); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();


  let cardBlob = null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src = URL.createObjectURL(b); });

  // one-tap targets, message pre-filled
  const full = inviteText(), url = inviteUrl(), noUrl = full.replace(/\nBeat my score: .*$/,'\nBeat my score:');
  const E = encodeURIComponent;
  document.getElementById('t-wa').href = `https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href  = `https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href = `https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto = document.getElementById('sendto');
  const showTargets = () => { sendto.hidden = false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };

  // Native share sheet where the browser allows it; otherwise reveal the one-tap targets.
  document.getElementById('shareBtn').addEventListener('click', async () => {
    if(!navigator.share) return showTargets();
    const data = {title:'Fast Break', text: full};
    try{
      const file = cardBlob && new File([cardBlob], `fast-break-${dayNo}.png`, {type:'image/png'});
      if(file && navigator.canShare && navigator.canShare({files:[file]})) data.files=[file];
    }catch(e){}
    try{ await navigator.share(data); }
    catch(e){ if(e && e.name==='AbortError') return; showTargets(); }
  });

  document.getElementById('copyInvite').addEventListener('click', () => {
    const done = () => toast('Invite copied. Paste it to a friend');
    const fb = () => {
      const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full;
      document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it');
    };
    try{ navigator.clipboard.writeText(full).then(done,fb); }catch(e){ fb(); }
  });

  const tickCd=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const d=Math.max(0,(m-n)/1000|0);
    if(d===0){ setup(false); return intro(); }
    const c=document.getElementById('cd'); if(!c) return;
    c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tickCd(); cdTimer=setInterval(tickCd,1000);
}

/* ---------- share card (1080×1080 PNG) ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const C={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',accInk:'#06120B',bad:'#FF6B5A'};
  const cond = v => { if('fontStretch' in x) x.fontStretch = v; };
  const P=80, s=total();
  x.fillStyle=C.bg; x.fillRect(0,0,W,W);
  // pitch-line motif: centre circle arc in the corner
  x.strokeStyle=C.line; x.lineWidth=4; x.beginPath(); x.arc(W+40,W*0.42,300,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W-260,0); x.lineTo(W-260,W); x.stroke();

  x.textBaseline='alphabetic';
  cond('condensed'); x.font='900 64px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  x.fillText('FAST',P,P+52); const fw=x.measureText('FAST ').width;
  x.fillStyle=C.acc; x.fillText('BREAK',P+fw,P+52);
  cond('normal'); x.font='600 26px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.textAlign='right';
  x.fillText(`NO. ${dayNo} · ${dateLabel.toUpperCase()}`, W-P, P+48); x.textAlign='left';
  x.fillStyle=C.ink; x.fillRect(P,P+80,W-2*P,4);

  x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText(state.gaveUp?'I GAVE UP TODAY':'I SCORED',P,P+170);
  cond('condensed'); x.font='900 340px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  const sw = x.measureText(String(s)).width; x.fillText(String(s),P-8,P+460);
  cond('normal'); x.font='600 48px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('/100',P+sw+10,P+460);
  cond('condensed'); x.font='800 52px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=state.gaveUp?C.bad:C.acc;
  x.fillText(verdict(s).toUpperCase(),P,P+540);

  // results grid
  const gap=10, cell=(W-2*P-9*gap)/10, gy=P+590;
  const fill = p => p===0?C.bad:p===5?C.acc:p>=3?'#2A9E62':p>=1?'#1E5B3D':C.line;
  state.results.forEach((r,i)=>{
    const cx=P+(i%10)*(cell+gap), cy=gy+Math.floor(i/10)*(cell+gap);
    x.fillStyle=fill(r.pts); x.fillRect(cx,cy,cell,cell);
    cond('normal'); x.font='600 30px "IBM Plex Mono",monospace'; x.textAlign='center';
    x.fillStyle = r.pts===5?C.accInk:r.pts===0?C.bg:C.ink; x.fillText(String(r.pts),cx+cell/2,cy+cell/2+11); x.textAlign='left';
  });

  const by = W-P-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  x.fillText('THINK YOU’RE QUICKER? BEAT MY SCORE.',P,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted;
  x.fillText(MODES_ON?`20 QUESTIONS · ${FB_MODES[modeKey()].name.toUpperCase()} MODE · ${LIMIT}S EACH`:'20 QUESTIONS · 10 SECONDS EACH · ONE GO A DAY',P,by);
  return new Promise(res=>c.toBlob(b=>res(b),'image/png'));
}

let tt=0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- day rollover: always the player's own calendar day. If the page is left open past midnight, load the new day's puzzle when they come back. ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
setup();
if(state.done) result();
else if(state.results.length>0) ask(state.results.length);
else intro();
})();
</script>
