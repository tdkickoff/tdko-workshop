<title>In The Mixer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Fast Break family. One narrow column; the letter board is the pitch, everything else stays quiet. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#0E1712; --muted:#5D6A62; --line:#D7DDD8;
  --accent:#0A8A4A; --accent-ink:#FFFFFF; --warn:#C98A00; --bad:#C93A2B; --soft:#E7ECE8;
  --tile:#0E1712; --tile-ink:#F2F4F1;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F;
  --tile:#EAF0EC; --tile-ink:#0B110E; color-scheme:dark}}
:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F;
  --tile:#EAF0EC; --tile-ink:#0B110E; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
main{display:flex;flex-direction:column;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.mark{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:28px;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line)}
.inner{padding:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

/* intro */
.hero{display:flex;flex-direction:column;gap:14px;padding:26px 20px 22px}
.hero h1{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(60px,19vw,104px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 i{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--muted);margin:0;max-width:36ch}
.challenge{border:1.5px solid var(--accent);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.challenge span{font-size:15px}
.challenge b{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.rules li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.rules li>span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder div{padding:10px 4px 9px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.ladder b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.ladder span{font-family:var(--f-mono);font-size:11px;opacity:.85}
.ladder .p100{background:var(--accent);color:var(--accent-ink)}
.ladder .p70{background:color-mix(in oklab,var(--accent) 55%,var(--bg));color:var(--ink)}
.ladder .p40{background:color-mix(in oklab,var(--accent) 22%,var(--bg));color:var(--ink)}
.ladder .p0{background:color-mix(in oklab,var(--bad) 22%,var(--bg));color:var(--bad)}

/* buttons */
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;cursor:pointer;background:var(--ink);color:var(--bg);touch-action:manipulation;
  font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:15px 12px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.linkbtn{all:unset;cursor:pointer;align-self:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.linkbtn:hover{color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.danger{background:var(--bad);color:#fff}
.confirm{border:1.5px solid var(--bad);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--bad);color:#fff}

/* board */
.board{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px 22px;border-bottom:1px solid var(--line)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px}
.word{display:flex;gap:4px}
.tile{width:clamp(26px,8.2vw,40px);aspect-ratio:4/5;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);
  font-family:var(--f-display);font-weight:900;font-stretch:75%;font-size:clamp(18px,5.6vw,28px);line-height:1;text-transform:uppercase}
.tile.win{background:var(--accent);color:var(--accent-ink)}
.tile.lose{background:var(--bad);color:#fff}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.tile.anim{animation:flip .32s ease-out both}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.lives{display:flex;align-items:center;gap:8px}
.disc{display:flex;align-items:flex-end;gap:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot i{width:16px;height:22px;box-sizing:border-box;border:1.5px dashed var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);transition:transform .3s,background .3s}
.slot span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.slot.on i{border:0;transform:rotate(-8deg)}
.slot.w.on i{background:var(--ink);color:var(--bg)}
.slot.y.on i{background:var(--warn)}
.slot.r.on i{background:var(--bad)}
.slot.on span{color:var(--ink)}
.pts{display:flex;align-items:baseline;gap:6px}
.pts b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:40px;line-height:.85;font-variant-numeric:tabular-nums;color:var(--accent)}
.pts b.mid{color:var(--warn)} .pts b.low{color:var(--bad)}

.hints{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 20px 0}
.hbtn{all:unset;box-sizing:border-box;cursor:pointer;touch-action:manipulation;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:11px 12px;border:1.5px dashed var(--line);font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hbtn:hover:not([aria-disabled="true"]){border-color:var(--warn);border-style:solid}
.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hbtn .c{color:var(--warn)}
.hbtn[aria-disabled="true"]{opacity:.4;cursor:default}
.hlist{display:flex;flex-direction:column;gap:8px;padding:12px 20px 0}
.hint{border-left:3px solid var(--warn);background:color-mix(in oklab,var(--warn) 10%,var(--surface));padding:9px 12px;font-size:15px;line-height:1.4}
.hint b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-right:6px}
.pad{height:20px}

.guess{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:1fr auto;gap:8px}
.grow input{box-sizing:border-box;width:100%;min-width:0;font:inherit;font-size:16px;font-weight:500;padding:13px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:0;-webkit-appearance:none}
.grow input:focus{outline:none;border-color:var(--ink)}
.grow input::placeholder{color:var(--muted)}
.grow .btn{padding:0 20px}
.fb{font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;min-height:18px;color:var(--muted)}
.fb.bad{color:var(--bad)} .fb.warn{color:var(--warn)}
.tried{display:flex;flex-wrap:wrap;gap:6px}
.tried span{font-size:13px;padding:3px 8px;background:color-mix(in oklab,var(--bad) 12%,var(--surface));color:var(--bad);text-decoration:line-through}

/* result */
.reveal{display:flex;flex-direction:column;gap:6px}
.reveal p{margin:0;font-size:15px;color:var(--muted);max-width:52ch}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(88px,26vw,130px);line-height:.82;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:22px;margin:0;text-transform:uppercase}
.vs{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vs b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.share{display:flex;flex-direction:column;gap:10px}
.share h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.share img{display:block;width:100%;max-width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--soft)}
.share p{margin:0;font-size:13px;color:var(--muted)}
.sendto{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgt{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;touch-action:manipulation}
.tgt:hover{border-color:var(--ink)}
.tgt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tgt.wa{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
textarea.copybox{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:13px;background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:10px;min-height:130px}
.next{text-align:center;display:flex;flex-direction:column;gap:2px}
.next b{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;padding:10px 16px;max-width:calc(100% - 40px);text-align:center;z-index:5}

@keyframes fadein{from{opacity:.35}to{opacity:1}}
.enter{animation:fadein .18s ease-out}
@media (prefers-reduced-motion: reduce){.enter,.tile.anim{animation:none}.btn,.slot i{transition:none}}
.replaying .sharecard{display:none}.replaying header.top::after{content:"Replay · doesn’t count";flex-basis:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark">In The <i>Mixer</i></div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){}
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });
</script>
<script>
(function(){
const GAME_URL = 'https://claude.ai/artifact/2LoQMavgN1EeCrF4dpPPEo';
const LAUNCH = Date.UTC(2026,10,16);   // SOFT LAUNCH: Mon 16 Nov 2026 is No. 1 (months count from 0). Before that date every day plays No. 1
const LIVES = 3, STEP = 30;                    // clean 100 / warning 70 / yellow 40 / red 0
const STEPS = [{k:'w',l:'Warning'},{k:'y',l:'Yellow'},{k:'r',l:'Red'}];

/* ---------- puzzles: every phrase is an exact anagram of the name (checked) ---------- */
const PUZZLES = [
 {name:"Wayne Rooney", phrase:"Yearn Woe Yon", aliases:["rooney"],
  blurb:"Manchester United's record goalscorer, and England's too until Harry Kane passed him in 2023.",
  hints:["Born in Croxteth, Liverpool.","Aged 16, he scored a late winner for Everton that ended Arsenal's 30-match unbeaten run."]},
 {name:"Luka Modric", phrase:"A Cold Murk I", aliases:["modric"],
  blurb:"Won the 2018 Ballon d'Or after leading Croatia to the World Cup final.",
  hints:["Born near Zadar, Croatia. His family became refugees during the war.","Had early loan spells at Zrinjski Mostar and Inter Zaprešić."]},
 {name:"Lionel Messi", phrase:"Lemon Lies Is", aliases:["messi","leo messi"],
  blurb:"Eight Ballon d'Ors, and a World Cup winner with Argentina in 2022.",
  hints:["Born in Rosario, Argentina.","Joined Barcelona's La Masia academy at 13, with the club paying for his growth hormone treatment."]},
 {name:"Didier Drogba", phrase:"Abide Grid Rod", aliases:["drogba"],
  blurb:"Scored the late equaliser and the winning penalty as Chelsea won the 2012 Champions League final.",
  hints:["Born in Abidjan, Ivory Coast, and moved to France aged five to live with his footballer uncle.","Signed his first professional contract at Le Mans."]},
 {name:"Erling Haaland", phrase:"Hail Grand Lean", aliases:["haaland"],
  blurb:"Set the Premier League record of 36 goals in a season in his first campaign with Manchester City.",
  hints:["Born in Leeds while his father played for Leeds United.","Scored nine goals in one match for Norway at the 2019 Under-20 World Cup."]},
 {name:"Paolo Maldini", phrase:"Piano Idol Lam", aliases:["maldini"],
  blurb:"Spent all 25 seasons of his career at AC Milan and won five European Cups.",
  hints:["Born in Milan, the son of former AC Milan captain Cesare Maldini.","Made his Serie A debut aged 16."]},
 {name:"Mohamed Salah", phrase:"Sham Halo Made", aliases:["salah","mo salah","mohammed salah"],
  blurb:"Liverpool's Egyptian King and a two-time African Footballer of the Year.",
  hints:["Born in the village of Nagrig, Egypt.","Started his senior career at El Mokawloon (Arab Contractors) in Cairo."]},
 {name:"Andres Iniesta", phrase:"Sardine Tisane", aliases:["iniesta"],
  blurb:"Scored the extra-time winner for Spain in the 2010 World Cup final.",
  hints:["Born in the small village of Fuentealbilla, Spain.","Joined Barcelona's La Masia academy aged 12."]},
 {name:"Gareth Bale", phrase:"Bathe Large", aliases:["bale"],
  blurb:"Wales's record goalscorer, with an overhead kick in the 2018 Champions League final.",
  hints:["Born in Cardiff, Wales.","Came through Southampton's academy at the same time as Theo Walcott."]},
 {name:"Thomas Muller", phrase:"Hamlet Slum Or", aliases:["muller","mueller","thomas mueller"],
  blurb:"A 2014 World Cup winner and Bayern Munich's record appearance maker.",
  hints:["Born in Weilheim, Bavaria.","Spent his whole European career at Bayern Munich before joining Vancouver Whitecaps in 2025."]},
 {name:"Steven Gerrard", phrase:"Grave Rents Red", aliases:["gerrard","stevie g"],
  blurb:"Captained Liverpool's comeback from 3–0 down to win the 2005 Champions League final in Istanbul.",
  hints:["Born in Whiston, Merseyside.","Joined Liverpool's academy at nine years old."]},
 {name:"Eden Hazard", phrase:"Head Zen Rad", aliases:["hazard"],
  blurb:"PFA Players' Player of the Year in 2015, and a two-time Premier League winner with Chelsea.",
  hints:["Born in La Louvière, Belgium.","Played for Royal Stade Brainois as a boy before joining Lille."]},
 {name:"Kylian Mbappe", phrase:"Bay Plain Kemp", aliases:["mbappe"],
  blurb:"A World Cup winner at 19, and scorer of a hat-trick in the 2022 final.",
  hints:["Grew up in Bondy, a suburb of Paris.","Made his Ligue 1 debut for Monaco aged 16."]},
 {name:"Cristiano Ronaldo", phrase:"Cartoon Ordinal Is", aliases:["ronaldo","cr7","cristiano"],
  blurb:"Five Ballon d'Ors, and the all-time top scorer in men's international football.",
  hints:["Born in Funchal, on the Portuguese island of Madeira.","Played for Madeira clubs Andorinha and Nacional as a boy before Sporting CP."]}
];

/* ---------- day ---------- */
const now = new Date();
const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const dayNo = LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
const P = PUZZLES[(dayNo-1) % PUZZLES.length];
const dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const REPLAY = tdkoIsReplay('in-the-mixer', dayKey, dayNo), KEY = 'scramble:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
if(REPLAY){ tdkoReplayKey = KEY; document.documentElement.classList.add('replaying'); }
const app = document.getElementById('app');
document.getElementById('meta').textContent = `No. ${dayNo} · ${dateLabel}`;
const m = /^#c(\d+)-(\d{1,3})$/.exec(location.hash);
const challenge = (m && +m[1]===dayNo && +m[2]<=100) ? +m[2] : null;

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.strikes)) return s; }catch(e){} return null; }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date> → {gameId: {status, gaveUp}} */
function report(){ if(REPLAY) return; try{ const k='tdko:'+dayKey+'#'+dayNo, all=JSON.parse(localStorage.getItem(k)||'{}'); all['in-the-mixer']={status: S.over?'done':S.started?'open':'ready', gaveUp:!!S.gaveUp}; localStorage.setItem(k, JSON.stringify(all)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} report(); }
let S = load() || {started:false, strikes:[], hints:[], over:false, won:false, t0:null, t1:null};
// strikes: [{t:'h',i}|{t:'g',label}]

const score = () => (S.over && !S.won) ? 0 : 100 - STEP*S.strikes.length;
const letters = P.name.replace(/[^A-Za-z]/g,'').length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- matching: accents and case ignored, surname accepted, one-letter slip forgiven on long names ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const d=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
function isMatch(raw){
  const g = norm(raw); if(g.length<3) return false;
  const full = norm(P.name), opts=[full, ...(P.aliases||[]).map(norm)];
  if(opts.includes(g) || g.replace(/ /g,'')===full.replace(/ /g,'')) return true;
  return full.length>=10 && lev(g,full)<=1;
}

/* A press acts on pointerdown. After a touch, the browser's follow-up click is swallowed so it can't land on
   whatever the new screen put under the finger; with a mouse, the same element ignores its own follow-up click. */
let swallowUntil = 0;
document.addEventListener('pointerdown', ()=>{ swallowUntil = 0; }, true);
document.addEventListener('click', e=>{ if(performance.now() < swallowUntil){ swallowUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
function onPress(el, fn){
  let fired = false;
  const off = () => el.disabled || el.getAttribute('aria-disabled')==='true';
  el.addEventListener('pointerdown', e=>{ if(e.button!==0 || off()) return; e.preventDefault();
    if(e.pointerType==='mouse') fired = true; else swallowUntil = performance.now() + 600; fn(); });
  el.addEventListener('click', ()=>{ if(fired){ fired=false; return; } if(!off()) fn(); }); // keyboard Enter/Space
}
let tt=0;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

function tiles(text, cls='', anim=false){
  let k=0;
  return `<div class="words" aria-label="${esc(text)}">${text.split(' ').map(w=>`<div class="word">${[...w].map(ch=>`<span class="tile ${cls}${anim?' anim':''}" style="${anim?`animation-delay:${(k++)*28}ms`:''}">${esc(ch)}</span>`).join('')}</div>`).join('')}</div>`;
}

/* ---------- intro ---------- */
function intro(){
  app.innerHTML = `
  <section class="card enter"><div class="hero">
    <h1>In The<br><i>Mixer</i></h1>
    <p class="lede">A footballer's name, shuffled into nonsense. Unscramble it before the ref sends you off.</p>
    ${challenge!==null?`<div class="challenge"><span>A friend scored this on today's scramble. Can you beat them?</span><b>${challenge}</b></div>`:''}
    <ul class="rules">
      <li><span>Puzzle</span>The letters spell one footballer's name</li>
      <li><span>Fouls</span>A wrong guess or a hint is a foul</li>
      <li><span>Ref</span>First foul is a warning, second a yellow card, third a red</li>
      <li><span>Score</span>Warning drops you to 70, a yellow to 40. A red is 0</li>
    </ul>
    <div class="ladder" aria-label="Points by discipline">
      <div class="p100"><b>100</b><span>Clean</span></div><div class="p70"><b>70</b><span>Warning</span></div><div class="p40"><b>40</b><span>Yellow</span></div><div class="p0"><b>0</b><span>Red</span></div>
    </div>
    <button class="btn" id="go">Show the scramble</button>
  </div></section>`;
  onPress(document.getElementById('go'), ()=>{ S.started=true; S.t0=Date.now(); save(); game(true); });
}

/* ---------- game ---------- */
function game(anim){
  if(S.over) return result();
  const sc=score(), used=S.strikes.length, wrong=S.strikes.filter(s=>s.t==='g');
  app.innerHTML = `
  <section class="card">
    <div class="board">
      <span class="eyebrow">Scramble No. ${String(dayNo).padStart(3,'0')}</span>
      ${tiles(P.phrase,'',anim)}
      <span class="count">${letters} letters · ${P.name.split(' ').length} ${P.name.split(' ').length===1?'word':'words'} in the name</span>
    </div>
    <div class="status">
      <div class="disc" aria-label="${['No fouls yet','On a warning','On a yellow card'][used]||''}">${STEPS.map((st,i)=>`<div class="slot ${st.k}${i<used?' on':''}"><i>${st.k==='w'?'!':''}</i><span>${st.l}</span></div>`).join('')}</div>
      <div class="pts"><span class="eyebrow">Points</span><b class="${sc<=40?'low':sc<=70?'mid':''}">${sc}</b></div>
    </div>
    <div class="hints">${[0,1].map(i=>{ const u=S.hints.includes(i);
      return `<div role="button" tabindex="${u?-1:0}" class="hbtn" data-h="${i}" aria-disabled="${u}"><span>${u?'Hint '+(i+1)+' used':'Hint '+(i+1)}</span><span class="c">${u?'':'−'+STEP}</span></div>`; }).join('')}</div>
    ${S.hints.length?`<div class="hlist">${S.hints.map(i=>`<div class="hint"><b>Hint ${i+1}</b>${esc(P.hints[i])}</div>`).join('')}</div>`:''}
    <div class="pad"></div>
  </section>
  <form class="guess" id="gform" autocomplete="off">
    <div class="grow">
      <input id="gin" type="text" autocapitalize="words" spellcheck="false" placeholder="Name the footballer" aria-label="Your guess">
      <button class="btn" type="submit" id="gbtn">Guess</button>
    </div>
    <div class="fb ${used===LIVES-1?'warn':''}" id="fb">${used===1?'On a warning from the ref.':used===2?'On a yellow. One more foul and it\u2019s a red.':''}</div>
    ${wrong.length?`<div class="tried" aria-label="Wrong guesses">${wrong.map(w=>`<span>${esc(w.label)}</span>`).join('')}</div>`:''}
  </form>
  <div id="giveup"></div>`;
  drawGiveUp();
  app.querySelectorAll('.hbtn').forEach(b=>{
    const i=+b.dataset.h;
    onPress(b, ()=>hint(i));
    b.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(b.getAttribute('aria-disabled')!=='true') hint(i); } });
  });
  document.getElementById('gform').addEventListener('submit', e=>{ e.preventDefault(); guess(); });
}
let confirmOpen=false;
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answer.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;S.over=true;S.won=false;S.gaveUp=true;S.t1=Date.now();save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}
function strike(s){
  S.strikes.push(s);
  if(S.strikes.length>=LIVES){ S.over=true; S.won=false; S.t1=Date.now(); save(); result(); return true; }
  save(); return false;
}
function hint(i){
  if(S.over || S.hints.includes(i)) return;
  S.hints.push(i);
  if(!strike({t:'h',i})) game(false);
}
function guess(){
  const inp=document.getElementById('gin'), raw=inp.value.trim();
  if(!raw) return;
  if(isMatch(raw)){ S.over=true; S.won=true; S.t1=Date.now(); save(); return result(); }
  if(S.strikes.some(s=>s.t==='g' && norm(s.label)===norm(raw))){ const f=document.getElementById('fb'); f.className='fb warn'; f.textContent='Already tried that one. The ref lets it go.'; inp.select(); return; }
  if(strike({t:'g',label:raw})) return;
  game(false);
  const f=document.getElementById('fb'), left=LIVES-S.strikes.length;
  f.className = left===1?'fb warn':'fb bad';
  f.textContent = left===1 ? 'Not him. Yellow card. One more foul and it\u2019s a red.' : 'Not him. That\u2019s a warning from the ref.';
  document.getElementById('gin').focus({preventScroll:true});
}

/* ---------- result ---------- */
function verdict(s){
  if(S.gaveUp) return 'Gave up';
  if(s===100) return 'Clean sheet';
  if(s===70) return 'Spoken to by the ref';
  if(s===40) return 'Booked';
  return 'Sent off';
}
const marks = () => Array.from({length:LIVES},(_,i)=>{ const s=S.strikes[i]; return !s?'g':s.t==='h'?'o':'x'; });
function secs(){ return (S.t0&&S.t1) ? Math.max(1, Math.round((S.t1-S.t0)/1000)) : null; }
const fmt = t => t==null?'—':t>=60?`${Math.floor(t/60)}m ${t%60}s`:`${t}s`;
function inviteUrl(){ return `${GAME_URL}#c${dayNo}-${score()}`; }
function inviteText(){
  const head = S.won ? `🔤 In The Mixer No. ${dayNo}: unscrambled for ${score()}/100${secs()?` in ${fmt(secs())}`:''}` : (S.gaveUp ? `🔤 In The Mixer No. ${dayNo}: 🏳️ gave up (0/100)` : `🔤 In The Mixer No. ${dayNo}: sent off today`);
  const disc = S.strikes.length ? ['⚠️','🟨','🟥'].slice(0,S.strikes.length).join('') : '✅ No fouls';
  return `${head}\n${disc}\n\nOne scrambled footballer a day. Can you crack it cleaner?\nTry today's scramble: ${inviteUrl()}`;
}
let cdTimer=0;
function result(){
  const s=score(), wrong=S.strikes.filter(x=>x.t==='g').length;
  let vs='';
  if(challenge!==null){ const d=s-challenge; vs=`<div class="vs">Your friend: <b>${challenge}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b>, a draw'}</div>`; }
  app.innerHTML = `
  <section class="card enter">
    <div class="board">
      <span class="eyebrow">${S.won?'Unscrambled':'The answer was'}</span>
      ${tiles(P.name.toUpperCase(), S.won?'win':'lose', true)}
      <span class="count">from “${esc(P.phrase)}”</span>
    </div>
    <div class="inner">
      <div class="reveal"><p>${esc(P.blurb)}</p></div>
      ${S.gaveUp?'<span class="flag">Gave up</span>':''}
      <div class="score"><b id="scr">0</b><span>/ 100</span></div>
      <p class="verdict">${verdict(s)}</p>
      ${vs}
      <div class="stats">
        <div><b>${S.won?fmt(secs()):'—'}</b><span>Time</span></div>
        <div><b>${wrong}</b><span>Wrong guesses</span></div>
        <div><b>${S.hints.length}</b><span>Hints</span></div>
      </div>
    </div>
  </section>
  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('in-the-mixer'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge a friend</h3>
    <img id="cardimg" alt="In The Mixer share card showing a score of ${s} out of 100">
    <p>Your friend gets today's scramble with your score as the one to beat. The card never shows the answer.</p>
    <button class="btn" id="shareBtn">Challenge a friend</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt wa" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">Next scramble in</span><b id="cd">--:--:--</b></div>`;

  const el=document.getElementById('scr'), t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-t0)/800); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();

  let cardBlob=null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src=URL.createObjectURL(b); });

  const full=inviteText(), url=inviteUrl(), noUrl=full.replace(/\nTry today's scramble: .*$/,'\nTry today\'s scramble:'), E=encodeURIComponent;
  document.getElementById('t-wa').href=`https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href=`https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href=`https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href=`https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto=document.getElementById('sendto');
  const showTargets=()=>{ sendto.hidden=false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    if(!navigator.share) return showTargets();
    const data={title:'In The Mixer', text:full};
    try{ const f=cardBlob&&new File([cardBlob],`in-the-mixer-${dayNo}.png`,{type:'image/png'}); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) data.files=[f]; }catch(e){}
    try{ await navigator.share(data); }catch(e){ if(e&&e.name==='AbortError') return; showTargets(); }
  });
  document.getElementById('copyInvite').addEventListener('click', ()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full; document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it'); };
    try{ navigator.clipboard.writeText(full).then(()=>toast('Invite copied. Paste it to a friend'),fb); }catch(e){ fb(); }
  });

  clearInterval(cdTimer);
  const tick=()=>{const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const d=Math.max(0,(mid-n)/1000|0);
    if(d===0){ clearInterval(cdTimer); return location.reload(); }
    const c=document.getElementById('cd'); if(c) c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tick(); cdTimer=setInterval(tick,1000);
}

/* ---------- share card (1080×1080, shows the scramble, never the answer) ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const C={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',accInk:'#06120B',warn:'#F2B53A',bad:'#FF6B5A'};
  const cond=v=>{ if('fontStretch' in x) x.fontStretch=v; };
  const Pd=80, s=score();
  x.fillStyle=C.bg; x.fillRect(0,0,W,W);
  x.strokeStyle=C.line; x.lineWidth=4; x.beginPath(); x.arc(W+40,W*0.42,300,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W-260,0); x.lineTo(W-260,W); x.stroke();
  cond('condensed'); x.font='900 60px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  x.fillText('IN THE',Pd,Pd+50); const w=x.measureText('IN THE ').width; x.fillStyle=C.acc; x.fillText('MIXER',Pd+w,Pd+50);
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.textAlign='right';
  x.fillText(`NO. ${dayNo} · ${dateLabel.toUpperCase()}`,W-Pd,Pd+46); x.textAlign='left';
  x.fillStyle=C.ink; x.fillRect(Pd,Pd+80,W-2*Pd,4);
  // the scramble itself as tiles
  const phrase=P.phrase.toUpperCase(), chars=[...phrase], tw=Math.min(62,(W-2*Pd)/chars.length-6), th=tw*1.25;
  let tx=Pd, ty=Pd+120;
  cond('condensed'); x.font=`900 ${Math.round(tw*0.72)}px Archivo,"Arial Narrow",sans-serif`; x.textAlign='center';
  chars.forEach(ch=>{ if(ch===' '){ tx+=tw*0.6; return; } x.fillStyle=C.ink; x.fillRect(tx,ty,tw,th); x.fillStyle=C.bg; x.fillText(ch,tx+tw/2,ty+th*0.72); tx+=tw+6; });
  x.textAlign='left';
  cond('normal'); x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText(S.won?'I UNSCRAMBLED IT FOR':S.gaveUp?'I GAVE UP TODAY':'IT BEAT ME TODAY',Pd,Pd+290);
  cond('condensed'); x.font='900 300px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  const sw=x.measureText(String(s)).width; x.fillText(String(s),Pd-8,Pd+545);
  cond('normal'); x.font='600 48px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('/100',Pd+sw+10,Pd+545);
  cond('condensed'); x.font='800 52px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=s?C.acc:C.bad; x.fillText(verdict(s).toUpperCase(),Pd,Pd+620);
  const fillc=[C.ink,C.warn,C.bad], cw=70, ch=96;
  STEPS.forEach((st,i)=>{ const on=i<S.strikes.length; x.save(); x.translate(Pd+i*(cw+40)+cw/2, Pd+668+ch/2);
    if(on){ x.rotate(-0.14); x.fillStyle=fillc[i]; x.fillRect(-cw/2,-ch/2,cw,ch); if(i===0){ x.fillStyle=C.bg; x.font='800 54px Archivo,sans-serif'; x.textAlign='center'; x.fillText('!',0,18); } }
    else { x.setLineDash([10,8]); x.strokeStyle=C.muted; x.lineWidth=3; x.strokeRect(-cw/2,-ch/2,cw,ch); }
    x.restore(); });
  x.textAlign='left';
  const by=W-Pd-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink; x.fillText('CAN YOU CRACK IT CLEANER?',Pd,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('ONE SCRAMBLED FOOTBALLER · WARNING, YELLOW, RED · ONE GO A DAY',Pd,by);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'));
}

/* ---------- day rollover: always the player's own calendar day. If the page is left open past midnight, load the new day's puzzle when they come back. ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
if(S.over) result(); else if(S.started) game(true); else intro();
})();
</script>
