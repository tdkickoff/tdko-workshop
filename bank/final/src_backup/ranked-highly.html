<title>Ranked Highly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Fast Break family. One narrow column; the four-row table is the pitch. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#0E1712; --muted:#5D6A62; --line:#D7DDD8;
  --accent:#0A8A4A; --accent-ink:#FFFFFF; --warn:#C98A00; --bad:#C93A2B; --soft:#E7ECE8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F; color-scheme:dark}}
:root[data-tdko="dark"]{
  --bg:#0B110E; --surface:#121A16; --ink:#EAF0EC; --muted:#8A988F; --line:#24302A;
  --accent:#34D27F; --accent-ink:#06120B; --warn:#F2B53A; --bad:#FF6B5A; --soft:#1A241F; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100%;box-sizing:border-box}
main{display:flex;flex-direction:column;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.mark{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:28px;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.mark i{font-style:normal;color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line)}
.inner{padding:20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

/* intro */
.hero{display:flex;flex-direction:column;gap:14px;padding:26px 20px 22px}
.hero h1{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(60px,19vw,104px);line-height:.86;margin:0;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 i{font-style:normal;color:var(--accent)}
.lede{font-size:17px;color:var(--muted);margin:0;max-width:36ch}
.challenge{border:1.5px solid var(--accent);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.challenge span{font-size:15px}
.challenge b{font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.rules li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.rules li>span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ladder div{padding:10px 4px 9px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.ladder b{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.ladder span{font-family:var(--f-mono);font-size:11px;opacity:.85}
.ladder .p100{background:var(--accent);color:var(--accent-ink)}
.ladder .p60{background:color-mix(in oklab,var(--accent) 55%,var(--bg));color:var(--ink)}
.ladder .p30{background:color-mix(in oklab,var(--accent) 22%,var(--bg));color:var(--ink)}
.ladder .p0{background:color-mix(in oklab,var(--bad) 22%,var(--bg));color:var(--bad)}

/* buttons */
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;cursor:pointer;background:var(--ink);color:var(--bg);touch-action:manipulation;
  font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em;padding:15px 12px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn[aria-disabled="true"]{opacity:.35;cursor:default}
.btn[aria-disabled="true"]:hover{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.linkbtn{all:unset;cursor:pointer;align-self:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
.linkbtn:hover{color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.danger{background:var(--bad);color:#fff}
.confirm{border:1.5px solid var(--bad);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--bad);color:#fff}

.act{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.fb{font-family:var(--f-mono);font-size:12px;letter-spacing:.03em;min-height:18px;color:var(--muted);text-align:center}
.fb.bad{color:var(--bad)} .fb.warn{color:var(--warn)}

/* result */
.reveal{display:flex;flex-direction:column;gap:6px}
.reveal h2{margin:0;font-family:var(--f-display);font-weight:900;font-stretch:70%;font-size:clamp(30px,8.5vw,42px);line-height:.95;text-transform:uppercase}
.reveal p{margin:0;font-size:15px;color:var(--muted);max-width:52ch}
.reveal p b{color:var(--ink)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(88px,26vw,130px);line-height:.82;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-mono);font-size:20px;color:var(--muted)}
.verdict{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-size:22px;margin:0;text-transform:uppercase}
.vs{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vs b{color:var(--ink)}
.share{display:flex;flex-direction:column;gap:10px}
.share h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.share img{display:block;width:100%;max-width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--soft)}
.share p{margin:0;font-size:13px;color:var(--muted)}
.sendto{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgt{display:block;text-align:center;padding:13px 8px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;touch-action:manipulation}
.tgt:hover{border-color:var(--ink)}
.tgt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tgt.wa{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--surface))}
textarea.copybox{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:13px;background:var(--soft);color:var(--ink);border:1px solid var(--line);padding:10px;min-height:130px}
.next{text-align:center;display:flex;flex-direction:column;gap:2px}
.next b{font-family:var(--f-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;padding:10px 16px;max-width:calc(100% - 40px);text-align:center;z-index:5}

@keyframes fadein{from{opacity:.35}to{opacity:1}}
.enter{animation:fadein .18s ease-out}
@media (prefers-reduced-motion: reduce){.enter{animation:none}.btn,.rk{transition:none}}
.replaying .sharecard{display:none}.replaying header.top::after{content:"Replay · doesn’t count";flex-basis:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}

/* theme + progress */
.qbox{padding:18px 20px 6px;display:flex;flex-direction:column;gap:6px}
.qbox h2{margin:0;font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:clamp(26px,7.4vw,34px);line-height:1;text-transform:uppercase}
.calls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:600}
.dots i.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots i.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dots i.now{border-color:var(--ink)}
.calls .pts{display:flex;align-items:baseline;gap:6px}
.calls .pts b{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:40px;line-height:.85;font-variant-numeric:tabular-nums;color:var(--accent)}

/* the two players */
.duel{display:grid;grid-template-columns:1fr;gap:10px;padding:14px 16px}
.pc{border:1.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pc .who{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:clamp(24px,7vw,32px);line-height:1;text-transform:uppercase}
.pc .val{font-family:var(--f-display);font-weight:900;font-stretch:66%;font-size:clamp(48px,15vw,64px);line-height:.9;font-variant-numeric:tabular-nums}
.pc .val small{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:.03em}
.pc.known{background:var(--soft)}
.pc.mystery .val{color:var(--muted)}
.pc.ok{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pc.ok .val{color:var(--accent)}
.pc.no{border-color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.pc.no .val{color:var(--bad)}
.vs2{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.hl .btn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;padding:18px 10px}
.hl .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes flip{0%{transform:rotateX(90deg);opacity:.2}100%{transform:none;opacity:1}}
.flip{animation:flip .35s ease-out}

/* final table of the chain */
.chainlist{display:flex;flex-direction:column;gap:6px;padding:4px 16px 0}
.cl{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line)}
.cl .n{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.cl .nm{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:17px;text-transform:uppercase;line-height:1.05}
.cl .v{font-family:var(--f-mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl.ok{border-color:var(--accent)} .cl.ok .n{color:var(--accent)}
.cl.no{border-color:var(--bad)} .cl.no .n{color:var(--bad)}
.cl.unseen{opacity:.6}
@media (prefers-reduced-motion: reduce){.flip{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark">Ranked <i>Highly</i></div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){}
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });
</script>
<script>
(function(){
const GAME_URL = 'https://claude.ai/artifact/RANKED_HIGHLY';
const LAUNCH = Date.UTC(2026,10,16);   // SOFT LAUNCH: Mon 16 Nov 2026 is No. 1 (months count from 0). Before that date every day plays No. 1
const CALLS = 5, PER = 20;
const OPENS = '2026-11-23';   // joins the daily line-up on this date; testers can play before then

/* ---------- chains: start player then five more; each call is higher or lower than the player before ----------
   Build-up gaps: calls 1-3 differ by 20-30%, calls 4-5 by 5-10%. asof is shown when the numbers can still change. */
const CHAINS = [{"id": "wales-caps", "theme": "Wales caps", "unit": "caps", "chain": [["Dean Saunders", 75], ["Neville Southall", 92], ["Gareth Bale", 111], ["Gary Speed", 85], ["Craig Bellamy", 78], ["Ian Rush", 73]]}, {"id": "spurs-goals", "theme": "Goals for Tottenham (all competitions)", "unit": "goals", "chain": [["Glenn Hoddle", 110], ["Jermain Defoe", 143], ["Martin Chivers", 174], ["Robbie Keane", 122], ["Alan Gilzean", 133], ["Teddy Sheringham", 124]]}, {"id": "lfc-apps", "theme": "Appearances for Liverpool", "unit": "apps", "chain": [["Ian Callaghan", 857], ["Phil Neal", 650], ["Kenny Dalglish", 515], ["Emlyn Hughes", 665], ["Bruce Grobbelaar", 628], ["Ian Rush", 660]]}, {"id": "pl-apps", "theme": "Premier League appearances", "unit": "apps", "chain": [["Mark Schwarzer", 514], ["Gareth Barry", 653], ["Emile Heskey", 516], ["Ryan Giggs", 632], ["David James", 572], ["Gary Speed", 535]]}, {"id": "eng-caps", "theme": "England caps", "unit": "caps", "chain": [["Stuart Pearce", 78], ["David Platt", 62], ["David Seaman", 75], ["Bryan Robson", 90], ["Ray Wilkins", 84], ["Michael Owen", 89]]}, {"id": "eng-caps-2", "theme": "England caps", "unit": "caps", "chain": [["Steven Gerrard", 114], ["Gary Neville", 85], ["Alan Shearer", 63], ["John Barnes", 79], ["Kenny Sansom", 86], ["John Terry", 78]]}, {"id": "ireland-caps", "theme": "Republic of Ireland caps", "unit": "caps", "chain": [["Robbie Keane", 146], ["Kevin Kilbane", 110], ["Shay Given", 134], ["Damien Duff", 100], ["Niall Quinn", 91], ["Paul McGrath", 83]]}, {"id": "pl-goals", "theme": "Premier League goals", "unit": "goals", "chain": [["Wayne Rooney", 208], ["Robbie Fowler", 163], ["Dwight Yorke", 123], ["Les Ferdinand", 149], ["Jermain Defoe", 162], ["Frank Lampard", 177]]}, {"id": "chelsea-goals", "theme": "Goals for Chelsea (all competitions)", "unit": "goals", "chain": [["Frank Lampard", 211], ["Peter Osgood", 150], ["Eden Hazard", 110], ["Gianfranco Zola", 80], ["Jimmy Floyd Hasselbaink", 87], ["Eiður Guðjohnsen", 78]]}, {"id": "mufc-apps", "theme": "Appearances for Manchester United", "unit": "apps", "chain": [["Bobby Charlton", 758], ["Ryan Giggs", 963], ["Paul Scholes", 718], ["Wayne Rooney", 559], ["Gary Neville", 602], ["David de Gea", 545]]}, {"id": "season-goals", "theme": "Premier League goals in one season", "unit": "goals", "chain": [["Kevin Phillips (1999–2000)", 30], ["Fernando Torres (2007–08)", 24], ["Didier Drogba (2009–10)", 29], ["Erling Haaland (2022–23)", 36], ["Andy Cole (1993–94)", 34], ["Mohamed Salah (2017–18)", 32]]}, {"id": "ned-caps", "theme": "Netherlands caps", "unit": "caps", "chain": [["Marc Overmars", 86], ["Giovanni van Bronckhorst", 106], ["Wesley Sneijder", 134], ["Dirk Kuyt", 104], ["Frank de Boer", 112], ["Robin van Persie", 102]]}, {"id": "sco-caps", "theme": "Scotland caps", "unit": "caps", "chain": [["Willie Miller", 65], ["Darren Fletcher", 80], ["Kenny Dalglish", 102], ["Alex McLeish", 77], ["Tom Boyd", 72], ["Paul McStay", 76]]}, {"id": "eng-goals", "theme": "England goals", "unit": "goals", "chain": [["Jimmy Greaves", 44], ["Wayne Rooney", 53], ["Michael Owen", 40], ["Alan Shearer", 30], ["David Platt", 27], ["Frank Lampard", 29]]}];

/* ---------- day ---------- */
const now = new Date();
const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const dayNo = LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
if(!window.TDKO_TEST && dayKey < OPENS){ location.replace('./'); return; }
const P = CHAINS[(dayNo-1) % CHAINS.length];
const dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const REPLAY = tdkoIsReplay('ranked-highly', dayKey, dayNo), KEY = 'rankedhighly:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
if(REPLAY){ tdkoReplayKey = KEY; document.documentElement.classList.add('replaying'); }
const app = document.getElementById('app');
document.getElementById('meta').textContent = `No. ${dayNo} · ${dateLabel}`;
const m = /^#c(\d+)-(\d{1,3})$/.exec(location.hash);
const challenge = (m && +m[1]===dayNo && +m[2]<=100) ? +m[2] : null;

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.calls)) return s; }catch(e){} return null; }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date>#<no> → {gameId: {status, gaveUp}} */
function report(){ if(REPLAY) return; try{ const k='tdko:'+dayKey+'#'+dayNo, all=JSON.parse(localStorage.getItem(k)||'{}'); all['ranked-highly']={status: S.over?'done':S.started?'open':'ready', gaveUp:!!S.gaveUp}; localStorage.setItem(k, JSON.stringify(all)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} report(); }
let S = load() || {started:false, calls:[], over:false, won:false, gaveUp:false};

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const right = () => S.calls.filter(Boolean).length;
const score = () => S.gaveUp ? 0 : right()*PER;
const num = v => Number(v).toLocaleString('en-GB');
const UPI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>', DNI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

let swallowUntil = 0;
document.addEventListener('pointerdown', ()=>{ swallowUntil = 0; }, true);
document.addEventListener('click', e=>{ if(performance.now() < swallowUntil){ swallowUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
function onPress(el, fn){
  let fired = false;
  const off = () => el.disabled || el.getAttribute('aria-disabled')==='true';
  el.addEventListener('pointerdown', e=>{ if(e.button!==0 || off()) return; e.preventDefault();
    if(e.pointerType==='mouse') fired = true; else swallowUntil = performance.now() + 600; fn(); });
  el.addEventListener('click', ()=>{ if(fired){ fired=false; return; } if(!off()) fn(); });
}
let tt=0;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- intro ---------- */
function intro(){
  app.innerHTML = `
  <section class="card enter"><div class="hero">
    <h1>Ranked<br><i>Highly</i></h1>
    <p class="lede">Higher or lower? Make five right calls in a row to be ranked highly. One wrong call and you're out.</p>
    ${challenge!==null?`<div class="challenge"><span>A friend scored this on today's chain. Can you beat them?</span><b>${challenge}</b></div>`:''}
    <ul class="rules">
      <li><span>Theme</span>One stat a day, like caps for one country or goals for one club</li>
      <li><span>Call</span>Has the next player got more or less than the last one?</li>
      <li><span>Calls</span>Five in a row. They get closer as you go</li>
      <li><span>Score</span>20 points for every right call. A wrong call ends it</li>
    </ul>
    <div class="ladder" aria-label="Points by calls">
      <div class="p100"><b>100</b><span>5 right</span></div><div class="p60"><b>60</b><span>3 right</span></div><div class="p30"><b>20</b><span>1 right</span></div><div class="p0"><b>0</b><span>First wrong</span></div>
    </div>
    <button class="btn" id="go">Make your first call</button>
  </div></section>`;
  onPress(document.getElementById('go'), ()=>{ S.started=true; save(); game(); });
}

/* ---------- game ---------- */
let busy=false;
function dots(){ return `<div class="dots" aria-label="${right()} of ${CALLS} calls right">${Array.from({length:CALLS},(_,i)=>{ const c=S.calls[i];
  return `<i class="${c===true?'ok':c===false?'no':i===S.calls.length?'now':''}">${c===true?'✓':c===false?'✗':i+1}</i>`; }).join('')}</div>`; }
function game(reveal){
  if(S.over && !reveal) return result();
  const pos = reveal ? S.calls.length-1 : S.calls.length;
  const a=P.chain[pos], b=P.chain[pos+1], res = reveal ? S.calls[pos] : null;
  app.innerHTML = `
  <section class="card">
    <div class="calls">${dots()}<div class="pts"><span class="eyebrow">Points</span><b>${score()}</b></div></div>
    <div class="qbox"><span class="eyebrow">Call ${pos+1} of ${CALLS}${P.asof?` · As of ${esc(P.asof)}`:''}</span><h2>${esc(P.theme)}</h2></div>
    <div class="duel">
      <div class="pc known"><span class="who">${esc(a[0])}</span><span class="val">${num(a[1])}<small>${esc(P.unit)}</small></span></div>
      <div class="vs2">${reveal?(res?'Right call':'Wrong call'):`Has ${esc(b[0])} got more or fewer?`}</div>
      <div class="pc ${reveal?(res?'ok':'no'):'mystery'}"><span class="who">${esc(b[0])}</span><span class="val${reveal?' flip':''}">${reveal?num(b[1]):'?'}<small>${esc(P.unit)}</small></span></div>
    </div>
    <div class="hl">
      <button class="btn" id="up" aria-disabled="${!!reveal}">${UPI}Higher</button>
      <button class="btn" id="down" aria-disabled="${!!reveal}">${DNI}Lower</button>
    </div>
  </section>
  <div id="giveup"></div>`;
  if(!reveal){ drawGiveUp(); onPress(document.getElementById('up'),()=>call(true)); onPress(document.getElementById('down'),()=>call(false)); }
}
function call(up){
  if(busy||S.over) return; busy=true;
  const pos=S.calls.length, a=P.chain[pos][1], b=P.chain[pos+1][1], ok = (b>a)===up;
  S.calls.push(ok);
  if(!ok){ S.over=true; S.won=false; } else if(S.calls.length>=CALLS){ S.over=true; S.won=true; }
  save(); game(true);
  setTimeout(()=>{ busy=false; S.over ? result() : game(); }, ok ? 1100 : 1700);
}
let confirmOpen=false;
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answers.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;S.over=true;S.won=false;S.gaveUp=true;save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}

/* ---------- result ---------- */
function verdict(s){
  if(S.gaveUp) return 'Gave up';
  if(s===100) return 'Ranked highly';
  if(s===80) return 'One call short';
  if(s>=40) return 'Mid-table';
  if(s===20) return 'Lower league';
  return 'Out of the rankings';
}
function inviteUrl(){ return `${GAME_URL}#c${dayNo}-${score()}`; }
const marks = () => Array.from({length:CALLS},(_,i)=>S.calls[i]===true?'✅':S.calls[i]===false?'❌':'⬜').join('');
function inviteText(){
  const s=score();
  const head = S.gaveUp ? `📈 Ranked Highly No. ${dayNo}: 🏳️ gave up (0/100)` : `📈 Ranked Highly No. ${dayNo}: ${right()}/${CALLS} right calls (${s}/100)`;
  return `${head}\n${marks()}\n\nHigher or lower, five calls in a row. Can you get ranked highly?\nBeat my score: ${inviteUrl()}`;
}
let cdTimer=0;
function result(){
  const s=score();
  let vs='';
  if(challenge!==null){ const d=s-challenge; vs=`<div class="vs">Your friend: <b>${challenge}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b>, a draw'}</div>`; }
  app.innerHTML = `
  <section class="card enter">
    <div class="qbox"><span class="eyebrow">The chain${P.asof?` · As of ${esc(P.asof)}`:''}</span><h2>${esc(P.theme)}</h2></div>
    <div class="chainlist">
      ${P.chain.map((p,i)=>{ const c=i?S.calls[i-1]:null, dir=i?(p[1]>P.chain[i-1][1]?'↑':'↓'):'';
        return `<div class="cl ${c===true?'ok':c===false?'no':i&&c===undefined?'unseen':''}"><span class="n">${i?dir:'Start'}</span><span class="nm">${esc(p[0])}</span><span class="v">${num(p[1])} ${esc(P.unit)}</span></div>`; }).join('')}
    </div>
    <div class="inner">
      ${S.gaveUp?'<span class="flag">Gave up</span>':''}
      <div class="score"><b id="scr">0</b><span>/ 100</span></div>
      <p class="verdict">${verdict(s)}</p>
      <span class="eyebrow">${right()} of ${CALLS} right calls</span>
      ${vs}
    </div>
  </section>
  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('ranked-highly'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge a friend</h3>
    <img id="cardimg" alt="Ranked Highly share card showing a score of ${s} out of 100">
    <p>Your friend gets today's chain with your score as the one to beat. The card never shows the answers.</p>
    <button class="btn" id="shareBtn">Challenge a friend</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt wa" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">Next chain in</span><b id="cd">--:--:--</b></div>`;

  const el=document.getElementById('scr'), t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-t0)/800); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();
  let cardBlob=null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src=URL.createObjectURL(b); });
  const full=inviteText(), url=inviteUrl(), noUrl=full.replace(/\nBeat my score: .*$/,'\nBeat my score:'), E=encodeURIComponent;
  document.getElementById('t-wa').href=`https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href=`https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href=`https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href=`https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto=document.getElementById('sendto');
  const showTargets=()=>{ sendto.hidden=false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    if(!navigator.share) return showTargets();
    const data={title:'Ranked Highly', text:full};
    try{ const f=cardBlob&&new File([cardBlob],`ranked-highly-${dayNo}.png`,{type:'image/png'}); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) data.files=[f]; }catch(e){}
    try{ await navigator.share(data); }catch(e){ if(e&&e.name==='AbortError') return; showTargets(); }
  });
  document.getElementById('copyInvite').addEventListener('click', ()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full; document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it'); };
    try{ navigator.clipboard.writeText(full).then(()=>toast('Invite copied. Paste it to a friend'),fb); }catch(e){ fb(); }
  });
  clearInterval(cdTimer);
  const tk=()=>{const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const d=Math.max(0,(mid-n)/1000|0);
    if(d===0){ clearInterval(cdTimer); return location.reload(); }
    const c=document.getElementById('cd'); if(c) c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tk(); cdTimer=setInterval(tk,1000);
}

/* ---------- share card (1080×1080): score and the five calls, never the players ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const C={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',accInk:'#06120B',warn:'#F2B53A',bad:'#FF6B5A'};
  const cond=v=>{ if('fontStretch' in x) x.fontStretch=v; };
  const Pd=80, s=score();
  x.fillStyle=C.bg; x.fillRect(0,0,W,W);
  x.strokeStyle=C.line; x.lineWidth=4; x.beginPath(); x.arc(W+40,W*0.42,300,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W-260,0); x.lineTo(W-260,W); x.stroke();
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; const dl=`NO. ${dayNo} · ${dateLabel.toUpperCase()}`, dw=x.measureText(dl).width;
  let fs=56; cond('condensed'); do{ x.font=`900 ${fs}px Archivo,"Arial Narrow",sans-serif`; fs-=2; }while(fs>28 && x.measureText('RANKED HIGHLY').width > W-2*Pd-dw-30);
  x.fillStyle=C.ink; x.fillText('RANKED ',Pd,Pd+50); const w=x.measureText('RANKED ').width; x.fillStyle=C.acc; x.fillText('HIGHLY',Pd+w,Pd+50);
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.textAlign='right'; x.fillText(dl,W-Pd,Pd+46); x.textAlign='left';
  x.fillStyle=C.ink; x.fillRect(Pd,Pd+80,W-2*Pd,4);
  x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=C.muted;
  x.fillText(S.gaveUp?'I GAVE UP TODAY':`${right()} OF ${CALLS} RIGHT CALLS`,Pd,Pd+170);
  cond('condensed'); x.font='900 300px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  const sw=x.measureText(String(s)).width; x.fillText(String(s),Pd-8,Pd+430);
  cond('normal'); x.font='600 48px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('/100',Pd+sw+10,Pd+430);
  cond('condensed'); x.font='800 52px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=s?C.acc:C.bad; x.fillText(verdict(s).toUpperCase(),Pd,Pd+505);
  const cs=110, g=16, gy=Pd+560;
  for(let i=0;i<CALLS;i++){ const cx=Pd+i*(cs+g), r=S.calls[i];
    if(r===undefined){ x.setLineDash([10,8]); x.strokeStyle=C.muted; x.lineWidth=3; x.strokeRect(cx,gy,cs,cs); x.setLineDash([]); continue; }
    x.fillStyle=r?C.acc:C.bad; x.fillRect(cx,gy,cs,cs);
    x.strokeStyle=r?C.accInk:'#fff'; x.lineWidth=10; x.lineCap='round'; x.lineJoin='round'; x.beginPath();
    if(r){ x.moveTo(cx+28,gy+58); x.lineTo(cx+48,gy+78); x.lineTo(cx+84,gy+36); } else { x.moveTo(cx+34,gy+34); x.lineTo(cx+76,gy+76); x.moveTo(cx+76,gy+34); x.lineTo(cx+34,gy+76); }
    x.stroke(); }
  const by=W-Pd-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink; x.fillText('CAN YOU GET RANKED HIGHLY?',Pd,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('HIGHER OR LOWER · FIVE CALLS · ONE GO A DAY',Pd,by);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'));
}

/* ---------- day rollover ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
if(S.over) result(); else if(S.started) game(); else intro();
})();
</script>
