<title>Cup Run Sign-off</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#F2F4F1;--surface:#fff;--ink:#0E1712;--muted:#5D6A62;--line:#D7DDD8;--accent:#0A8A4A;--warn:#C98A00;--bad:#C93A2B;--soft:#E7ECE8;--f-d:"Archivo","Arial Narrow",system-ui,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B110E;--surface:#121A16;--ink:#EAF0EC;--muted:#8A988F;--line:#24302A;--accent:#34D27F;--warn:#F2B53A;--bad:#FF6B5A;--soft:#1A241F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B110E;--surface:#121A16;--ink:#EAF0EC;--muted:#8A988F;--line:#24302A;--accent:#34D27F;--warn:#F2B53A;--bad:#FF6B5A;--soft:#1A241F;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-d);margin:0;padding:0 16px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 0 60px}
h1{font-weight:900;font-stretch:68%;font-size:clamp(40px,10vw,64px);line-height:.9;text-transform:uppercase;margin:8px 0}h1 i{font-style:normal;color:var(--accent)}
.eb{font-family:var(--f-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:70ch}
h2{font-weight:800;font-stretch:78%;text-transform:uppercase;font-size:22px;margin:28px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.c{background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-top:4px solid var(--line);min-width:0}
.c.lvE{border-top-color:var(--accent)}.c.lvM{border-top-color:var(--warn)}.c.lvH{border-top-color:var(--bad)}
header{display:flex;gap:8px;align-items:baseline;font-family:var(--f-m);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
header .no{color:var(--ink);font-weight:600} header .lv{margin-left:auto}
h3{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-weight:900;font-stretch:72%;font-size:28px;text-transform:uppercase;line-height:1}
.sub{margin:0 0 8px;color:var(--muted);font-size:14px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
li{display:grid;grid-template-columns:86px 1fr;gap:8px}
.rn{font-family:var(--f-m);font-size:10.5px;text-transform:uppercase;color:var(--muted);padding-top:3px}
.ms{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.m{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:2px 6px 2px 4px;font-weight:700;font-stretch:85%;font-size:13.5px}
.m b{font-family:var(--f-m);font-weight:500;font-size:11px;color:var(--muted)}
.f{width:21px;height:14px;flex:none;box-shadow:0 0 0 1px var(--line)}.f.big{width:36px;height:24px}
.src{font-family:var(--f-m);font-size:10.5px;color:var(--muted);margin:8px 0 0}
.key{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-m);font-size:12px;color:var(--muted)}.key i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
</style>
