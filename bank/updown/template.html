<title>Ranked Highly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>%CSS%</style>

<div class="wrap">
  <header class="top">
    <div class="mark">Ranked <i>Highly</i></div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){}
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });
</script>
<script>
(function(){
const GAME_URL = 'https://claude.ai/artifact/RANKED_HIGHLY';
const LAUNCH = Date.UTC(2026,10,16);   // SOFT LAUNCH: Mon 16 Nov 2026 is No. 1 (months count from 0). Before that date every day plays No. 1
const CALLS = 5, PER = 20;
const OPENS = '2026-11-23';   // joins the daily line-up on this date; testers can play before then

/* ---------- chains: start player then five more; each call is higher or lower than the player before ----------
   Build-up gaps: calls 1-3 differ by 20-30%, calls 4-5 by 5-10%. asof is shown when the numbers can still change. */
const CHAINS = %DATA%;

/* ---------- day ---------- */
const now = new Date();
const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const dayNo = LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
if(!window.TDKO_TEST && dayKey < OPENS){ location.replace('./'); return; }
const P = CHAINS[(dayNo-1) % CHAINS.length];
const dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const REPLAY = tdkoIsReplay('ranked-highly', dayKey, dayNo), KEY = 'rankedhighly:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
if(REPLAY){ tdkoReplayKey = KEY; document.documentElement.classList.add('replaying'); }
const app = document.getElementById('app');
document.getElementById('meta').textContent = `No. ${dayNo} · ${dateLabel}`;
const m = /^#c(\d+)-(\d{1,3})$/.exec(location.hash);
const challenge = (m && +m[1]===dayNo && +m[2]<=100) ? +m[2] : null;

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.calls)) return s; }catch(e){} return null; }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date>#<no> → {gameId: {status, gaveUp}} */
function report(){ if(REPLAY) return; try{ const k='tdko:'+dayKey+'#'+dayNo, all=JSON.parse(localStorage.getItem(k)||'{}'); all['ranked-highly']={status: S.over?'done':S.started?'open':'ready', gaveUp:!!S.gaveUp}; localStorage.setItem(k, JSON.stringify(all)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} report(); }
let S = load() || {started:false, calls:[], over:false, won:false, gaveUp:false};

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const right = () => S.calls.filter(Boolean).length;
const score = () => S.gaveUp ? 0 : right()*PER;
const num = v => Number(v).toLocaleString('en-GB');
const UPI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>', DNI = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

let swallowUntil = 0;
document.addEventListener('pointerdown', ()=>{ swallowUntil = 0; }, true);
document.addEventListener('click', e=>{ if(performance.now() < swallowUntil){ swallowUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
function onPress(el, fn){
  let fired = false;
  const off = () => el.disabled || el.getAttribute('aria-disabled')==='true';
  el.addEventListener('pointerdown', e=>{ if(e.button!==0 || off()) return; e.preventDefault();
    if(e.pointerType==='mouse') fired = true; else swallowUntil = performance.now() + 600; fn(); });
  el.addEventListener('click', ()=>{ if(fired){ fired=false; return; } if(!off()) fn(); });
}
let tt=0;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- intro ---------- */
function intro(){
  app.innerHTML = `
  <section class="card enter"><div class="hero">
    <h1>Ranked<br><i>Highly</i></h1>
    <p class="lede">Higher or lower? Make five right calls in a row to be ranked highly. One wrong call and you're out.</p>
    ${challenge!==null?`<div class="challenge"><span>A friend scored this on today's chain. Can you beat them?</span><b>${challenge}</b></div>`:''}
    <ul class="rules">
      <li><span>Theme</span>One stat a day, like caps for one country or goals for one club</li>
      <li><span>Call</span>Has the next player got more or less than the last one?</li>
      <li><span>Calls</span>Five in a row. They get closer as you go</li>
      <li><span>Score</span>20 points for every right call. A wrong call ends it</li>
    </ul>
    <div class="ladder" aria-label="Points by calls">
      <div class="p100"><b>100</b><span>5 right</span></div><div class="p60"><b>60</b><span>3 right</span></div><div class="p30"><b>20</b><span>1 right</span></div><div class="p0"><b>0</b><span>First wrong</span></div>
    </div>
    <button class="btn" id="go">Make your first call</button>
  </div></section>`;
  onPress(document.getElementById('go'), ()=>{ S.started=true; save(); game(); });
}

/* ---------- game ---------- */
let busy=false;
function dots(){ return `<div class="dots" aria-label="${right()} of ${CALLS} calls right">${Array.from({length:CALLS},(_,i)=>{ const c=S.calls[i];
  return `<i class="${c===true?'ok':c===false?'no':i===S.calls.length?'now':''}">${c===true?'✓':c===false?'✗':i+1}</i>`; }).join('')}</div>`; }
function game(reveal){
  if(S.over && !reveal) return result();
  const pos = reveal ? S.calls.length-1 : S.calls.length;
  const a=P.chain[pos], b=P.chain[pos+1], res = reveal ? S.calls[pos] : null;
  app.innerHTML = `
  <section class="card">
    <div class="calls">${dots()}<div class="pts"><span class="eyebrow">Points</span><b>${score()}</b></div></div>
    <div class="qbox"><span class="eyebrow">Call ${pos+1} of ${CALLS}${P.asof?` · As of ${esc(P.asof)}`:''}</span><h2>${esc(P.theme)}</h2></div>
    <div class="duel">
      <div class="pc known"><span class="who">${esc(a[0])}</span><span class="val">${num(a[1])}<small>${esc(P.unit)}</small></span></div>
      <div class="vs2">${reveal?(res?'Right call':'Wrong call'):`Has ${esc(b[0])} got more or fewer?`}</div>
      <div class="pc ${reveal?(res?'ok':'no'):'mystery'}"><span class="who">${esc(b[0])}</span><span class="val${reveal?' flip':''}">${reveal?num(b[1]):'?'}<small>${esc(P.unit)}</small></span></div>
    </div>
    <div class="hl">
      <button class="btn" id="up" aria-disabled="${!!reveal}">${UPI}Higher</button>
      <button class="btn" id="down" aria-disabled="${!!reveal}">${DNI}Lower</button>
    </div>
  </section>
  <div id="giveup"></div>`;
  if(!reveal){ drawGiveUp(); onPress(document.getElementById('up'),()=>call(true)); onPress(document.getElementById('down'),()=>call(false)); }
}
function call(up){
  if(busy||S.over) return; busy=true;
  const pos=S.calls.length, a=P.chain[pos][1], b=P.chain[pos+1][1], ok = (b>a)===up;
  S.calls.push(ok);
  if(!ok){ S.over=true; S.won=false; } else if(S.calls.length>=CALLS){ S.over=true; S.won=true; }
  save(); game(true);
  setTimeout(()=>{ busy=false; S.over ? result() : game(); }, ok ? 1100 : 1700);
}
let confirmOpen=false;
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answers.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;S.over=true;S.won=false;S.gaveUp=true;save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}

/* ---------- result ---------- */
function verdict(s){
  if(S.gaveUp) return 'Gave up';
  if(s===100) return 'Ranked highly';
  if(s===80) return 'One call short';
  if(s>=40) return 'Mid-table';
  if(s===20) return 'Lower league';
  return 'Out of the rankings';
}
function inviteUrl(){ return `${GAME_URL}#c${dayNo}-${score()}`; }
const marks = () => Array.from({length:CALLS},(_,i)=>S.calls[i]===true?'✅':S.calls[i]===false?'❌':'⬜').join('');
function inviteText(){
  const s=score();
  const head = S.gaveUp ? `📈 Ranked Highly No. ${dayNo}: 🏳️ gave up (0/100)` : `📈 Ranked Highly No. ${dayNo}: ${right()}/${CALLS} right calls (${s}/100)`;
  return `${head}\n${marks()}\n\nHigher or lower, five calls in a row. Can you get ranked highly?\nBeat my score: ${inviteUrl()}`;
}
let cdTimer=0;
function result(){
  const s=score();
  let vs='';
  if(challenge!==null){ const d=s-challenge; vs=`<div class="vs">Your friend: <b>${challenge}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b>, a draw'}</div>`; }
  app.innerHTML = `
  <section class="card enter">
    <div class="qbox"><span class="eyebrow">The chain${P.asof?` · As of ${esc(P.asof)}`:''}</span><h2>${esc(P.theme)}</h2></div>
    <div class="chainlist">
      ${P.chain.map((p,i)=>{ const c=i?S.calls[i-1]:null, dir=i?(p[1]>P.chain[i-1][1]?'↑':'↓'):'';
        return `<div class="cl ${c===true?'ok':c===false?'no':i&&c===undefined?'unseen':''}"><span class="n">${i?dir:'Start'}</span><span class="nm">${esc(p[0])}</span><span class="v">${num(p[1])} ${esc(P.unit)}</span></div>`; }).join('')}
    </div>
    <div class="inner">
      ${S.gaveUp?'<span class="flag">Gave up</span>':''}
      <div class="score"><b id="scr">0</b><span>/ 100</span></div>
      <p class="verdict">${verdict(s)}</p>
      <span class="eyebrow">${right()} of ${CALLS} right calls</span>
      ${vs}
    </div>
  </section>
  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('ranked-highly'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge a friend</h3>
    <img id="cardimg" alt="Ranked Highly share card showing a score of ${s} out of 100">
    <p>Your friend gets today's chain with your score as the one to beat. The card never shows the answers.</p>
    <button class="btn" id="shareBtn">Challenge a friend</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt wa" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">Next chain in</span><b id="cd">--:--:--</b></div>`;

  const el=document.getElementById('scr'), t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-t0)/800); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();
  let cardBlob=null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src=URL.createObjectURL(b); });
  const full=inviteText(), url=inviteUrl(), noUrl=full.replace(/\nBeat my score: .*$/,'\nBeat my score:'), E=encodeURIComponent;
  document.getElementById('t-wa').href=`https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href=`https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href=`https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href=`https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto=document.getElementById('sendto');
  const showTargets=()=>{ sendto.hidden=false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    if(!navigator.share) return showTargets();
    const data={title:'Ranked Highly', text:full};
    try{ const f=cardBlob&&new File([cardBlob],`ranked-highly-${dayNo}.png`,{type:'image/png'}); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) data.files=[f]; }catch(e){}
    try{ await navigator.share(data); }catch(e){ if(e&&e.name==='AbortError') return; showTargets(); }
  });
  document.getElementById('copyInvite').addEventListener('click', ()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full; document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it'); };
    try{ navigator.clipboard.writeText(full).then(()=>toast('Invite copied. Paste it to a friend'),fb); }catch(e){ fb(); }
  });
  clearInterval(cdTimer);
  const tk=()=>{const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const d=Math.max(0,(mid-n)/1000|0);
    if(d===0){ clearInterval(cdTimer); return location.reload(); }
    const c=document.getElementById('cd'); if(c) c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tk(); cdTimer=setInterval(tk,1000);
}

/* ---------- share card (1080×1080): score and the five calls, never the players ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const C={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',accInk:'#06120B',warn:'#F2B53A',bad:'#FF6B5A'};
  const cond=v=>{ if('fontStretch' in x) x.fontStretch=v; };
  const Pd=80, s=score();
  x.fillStyle=C.bg; x.fillRect(0,0,W,W);
  x.strokeStyle=C.line; x.lineWidth=4; x.beginPath(); x.arc(W+40,W*0.42,300,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W-260,0); x.lineTo(W-260,W); x.stroke();
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; const dl=`NO. ${dayNo} · ${dateLabel.toUpperCase()}`, dw=x.measureText(dl).width;
  let fs=56; cond('condensed'); do{ x.font=`900 ${fs}px Archivo,"Arial Narrow",sans-serif`; fs-=2; }while(fs>28 && x.measureText('RANKED HIGHLY').width > W-2*Pd-dw-30);
  x.fillStyle=C.ink; x.fillText('RANKED ',Pd,Pd+50); const w=x.measureText('RANKED ').width; x.fillStyle=C.acc; x.fillText('HIGHLY',Pd+w,Pd+50);
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.textAlign='right'; x.fillText(dl,W-Pd,Pd+46); x.textAlign='left';
  x.fillStyle=C.ink; x.fillRect(Pd,Pd+80,W-2*Pd,4);
  x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=C.muted;
  x.fillText(S.gaveUp?'I GAVE UP TODAY':`${right()} OF ${CALLS} RIGHT CALLS`,Pd,Pd+170);
  cond('condensed'); x.font='900 300px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  const sw=x.measureText(String(s)).width; x.fillText(String(s),Pd-8,Pd+430);
  cond('normal'); x.font='600 48px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('/100',Pd+sw+10,Pd+430);
  cond('condensed'); x.font='800 52px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=s?C.acc:C.bad; x.fillText(verdict(s).toUpperCase(),Pd,Pd+505);
  const cs=110, g=16, gy=Pd+560;
  for(let i=0;i<CALLS;i++){ const cx=Pd+i*(cs+g), r=S.calls[i];
    if(r===undefined){ x.setLineDash([10,8]); x.strokeStyle=C.muted; x.lineWidth=3; x.strokeRect(cx,gy,cs,cs); x.setLineDash([]); continue; }
    x.fillStyle=r?C.acc:C.bad; x.fillRect(cx,gy,cs,cs);
    x.strokeStyle=r?C.accInk:'#fff'; x.lineWidth=10; x.lineCap='round'; x.lineJoin='round'; x.beginPath();
    if(r){ x.moveTo(cx+28,gy+58); x.lineTo(cx+48,gy+78); x.lineTo(cx+84,gy+36); } else { x.moveTo(cx+34,gy+34); x.lineTo(cx+76,gy+76); x.moveTo(cx+76,gy+34); x.lineTo(cx+34,gy+76); }
    x.stroke(); }
  const by=W-Pd-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink; x.fillText('CAN YOU GET RANKED HIGHLY?',Pd,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('HIGHER OR LOWER · FIVE CALLS · ONE GO A DAY',Pd,by);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'));
}

/* ---------- day rollover ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
if(S.over) result(); else if(S.started) game(); else intro();
})();
</script>
