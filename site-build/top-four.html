<script>
/* Site reset: bump TDKO_EPOCH to wipe every saved game and menu status the next time a page on this site opens. */
(function(){ var TDKO_EPOCH='2026-11-09-reset-1';
  try{ if(localStorage.getItem('tdko:epoch')===TDKO_EPOCH) return;
    var P=['tdko:','tdko-t:','tdko-all8:','fastbreak:','wtb:','scramble:','passconnect:','playedle:','shirtswap:','tikitaka:','offside:','topfour:','rankedhighly:','cleansweep:','cuprun:'], ks=[];
    for(var i=0;i<localStorage.length;i++) ks.push(localStorage.key(i));
    ks.forEach(function(k){ if(P.some(function(p){return k.indexOf(p)===0})) localStorage.removeItem(k); });
    localStorage.setItem('tdko:epoch',TDKO_EPOCH);
  }catch(e){} })();
</script>
<script>
/* Launch clear: the first time a page opens on or after Mon 16 Nov 2026 (player's own clock), wipe all progress, streaks and times saved before that date, so Day 1 and every streak start fresh at launch. Runs once per device. */
(function(){ try{ var d=new Date(), k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  if(k<20261116 || localStorage.getItem('tdko-launch')==='1') return;
  var P=['tdko:','tdko-t:','tdko-all8:','fastbreak:','wtb:','scramble:','passconnect:','playedle:','shirtswap:','tikitaka:','offside:','topfour:','rankedhighly:','cleansweep:','cuprun:'], ks=[];
  for(var i=0;i<localStorage.length;i++) ks.push(localStorage.key(i));
  ks.forEach(function(x){ if(!x || x==='tdko:epoch' || !P.some(function(p){return x.indexOf(p)===0})) return;
    var m=/(\d{4})-(\d\d)-(\d\d)/.exec(x); if(!m || (+m[1])*10000+(+m[2])*100+(+m[3]) < 20261116) localStorage.removeItem(x); });
  localStorage.setItem('tdko-launch','1');
}catch(e){} })();
</script>

/* streaks: kept on this device only, read from the daily status the games already save */
.streakcard .inner{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0}

<script>
/* Streak = days in a row this game was played to full time on this device. Giving up or missing a day resets it.
   Today's puzzle not played yet keeps yesterday's streak alive until midnight. */
function tdkoDateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function tdkoDoneDates(gid, gave){ const out=new Set();
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i), m=/^tdko:(\d{4}-\d\d-\d\d)#\d+$/.exec(k||''); if(!m) continue;
    let r={}; try{ r=JSON.parse(localStorage.getItem(k)||'{}')[gid]; }catch(e){}
    if(r && r.status==='done' && (gave ? r.gaveUp : !r.gaveUp)) out.add(m[1]); } }catch(e){}
  return out; }
function tdkoStreak(gid){
  const done=tdkoDoneDates(gid), now=new Date(), todayKey=tdkoDateKey(now), today=done.has(todayKey);
  let cur=0; const x=new Date(now.getFullYear(),now.getMonth(),now.getDate()); if(!today) x.setDate(x.getDate()-1);
  while(done.has(tdkoDateKey(x))){ cur++; x.setDate(x.getDate()-1); }
  const gaveToday=tdkoDoneDates(gid,true).has(todayKey); if(gaveToday) cur=0;   // giving up today ends the run
  let best=0, run=0, prev=null;
  [...done].sort().forEach(k=>{ const [y,m,d]=k.split('-').map(Number), t=new Date(y,m-1,d);
    if(prev){ const n=new Date(prev); n.setDate(n.getDate()+1); run = tdkoDateKey(n)===k ? run+1 : 1; } else run=1;
    prev=t; best=Math.max(best,run); });
  return {cur, best:Math.max(best,cur), today, gaveToday};
}
function tdkoStreakCard(gid){
  const s=tdkoStreak(gid), day=n=>n===1?'day':'days';
  const note = s.gaveToday ? '<div class="note bad">Giving up resets your streak. Play to full time tomorrow to start a new one.</div>'
    : s.cur>=2 ? `<div class="note">${s.cur} in a row. Come back tomorrow to keep it going.</div>`
    : s.cur===1 ? '<div class="note">Day one. Come back tomorrow to make it two.</div>'
    : '<div class="note">Play to full time tomorrow to start a streak.</div>';
  return `<section class="card streakcard"><div class="inner">
    <div class="sk${s.cur?' on':''}"><span class="eyebrow">Streak</span><b>${s.cur}<small>${day(s.cur)}</small></b></div>
    <div class="sk"><span class="eyebrow">Best</span><b>${s.best}<small>${day(s.best)}</small></b></div>
    ${note}</div></section>`;
}
</script>
<script>
/* Kick-off and full-time times for each game, kept beside the daily status (tdko-t:<date>#<no>) so the menu can show how long all eight took */
function tdkoStamp(k, gid, r){ try{ if(!r || r.status==='ready') return; const tk=k.replace(/^tdko:/,'tdko-t:'), all=JSON.parse(localStorage.getItem(tk)||'{}'), t=all[gid]||{}, now=Date.now();
  const day=(/^tdko:(\d{4}-\d\d-\d\d)/.exec(k)||[])[1];
  if(!t.s){ t.s=now; tdkoPlay(day, gid, 'start'); } if(r.status==='done' && !t.e){ t.e=now; tdkoPlay(day, gid, 'finish', !!r.gaveUp); }
  all[gid]=t; localStorage.setItem(tk, JSON.stringify(all)); }catch(e){} }
/* Replays: each replay run played to full time is counted once in "total completes" (run number kept per game and day on this device) */
function tdkoReplayNew(gid){ try{ const k='tdko-rp:'+gid, o=JSON.parse(localStorage.getItem(k)||'{}'), d=new Date(), day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const n={day, run:(o.day===day?o.run||0:0)+1, sent:o.day===day?o.sent||0:0}; localStorage.setItem(k, JSON.stringify(n));
  /* replay started (stats: total started) */
  const vid=localStorage.getItem('tdko-vid'); if(!window.TDKO_TEST && vid && localStorage.getItem('tdko-nocount')!=='1')
    fetch('/api/play',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({vid,day,game:gid,event:'rstart',run:n.run})}).catch(()=>{}); }catch(e){} }
function tdkoReplayDone(gid, day, r){ try{ if(window.TDKO_TEST || !r || r.status!=='done' || localStorage.getItem('tdko-nocount')==='1') return; const k='tdko-rp:'+gid, o=JSON.parse(localStorage.getItem(k)||'{}');
  if(o.day!==day || !o.run || o.sent>=o.run) return; o.sent=o.run; localStorage.setItem(k, JSON.stringify(o));
  let vid=localStorage.getItem('tdko-vid'); if(!vid) return;
  fetch('/api/play',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({vid,day,game:gid,event:'replay',run:o.run,gaveUp:!!r.gaveUp})}).catch(()=>{}); }catch(e){} }
/* Anonymous play counts (how many start and finish each game) so we can see where players stop. First goes count once per device; replays are counted separately (tdkoReplayDone). Never sent for test puzzles. */
function tdkoPlay(day, game, event, gaveUp){ try{ if(window.TDKO_TEST || !day || localStorage.getItem('tdko-nocount')==='1') return;
  let vid=localStorage.getItem('tdko-vid'); if(!vid){ vid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)); localStorage.setItem('tdko-vid',vid); }
  fetch('/api/play',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({vid,day,game,event,gaveUp:!!gaveUp})}).catch(()=>{}); }catch(e){} }
</script>
<script>var TDKO_T={"id": "pl-clean-sheets", "q": "Premier League clean sheets", "top": "Most", "bottom": "Fewest", "items": [["Petr Čech", "202 clean sheets"], ["David James", "169 clean sheets"], ["Mark Schwarzer", "151 clean sheets"], ["David Seaman", "141 clean sheets"]]};</script>
<script>
/* Replay: play today's puzzle again just for fun. The first result stays saved, and stays on the menu, until the next puzzle at midnight. */
function tdkoIsReplay(gid, dayKey, dayNo){ if(window.TDKO_TEST) return true; if(location.hash!=='#replay') return false;
  try{ const r=JSON.parse(localStorage.getItem('tdko:'+dayKey+'#'+dayNo)||'{}')[gid]; return !!r && r.status==='done'; }catch(e){ return false; } }
function tdkoReplayBox(on){ if(window.TDKO_TEST) return tdkoTestBox(); return `<section class="card replaybox"><div class="inner">
    <span class="eyebrow">${on?'Replay · just for fun':'Fancy another go?'}</span>
    <p>${on?'This one doesn’t count. Your first score today stays on the board.':'Replay today’s puzzle as often as you like. Your first score stays on the board.'}</p>
    <button class="btn ghost" type="button" data-replay>${on?'Replay again':'Replay'}</button>
  </div></section>`; }
let tdkoReplayKey='';
document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('[data-replay]')) return;
  try{ if(tdkoReplayKey) localStorage.removeItem(tdkoReplayKey); }catch(_){} tdkoReplayNew('top-four');
  history.replaceState(null,'',location.pathname+location.search+'#replay'); location.reload(); });

<script>
(function(){
const GAME_URL = 'https://tdko.app/';
const LAUNCH = Date.UTC(2026,10,16);   // SOFT LAUNCH: Mon 16 Nov 2026 is No. 1 (months count from 0). Before that date every day plays No. 1
/* Scoring: 100 points if solved within 10 seconds, then 10 fewer for every 5 seconds after. At 55 seconds the points run out. Unlimited tries, no penalty. */
const FREE = 10, STEP = 5, OUT = FREE + STEP*9;

/* ---------- questions: items are in the correct order, top to bottom; top/bottom say what goes at each end ---------- */
const QUESTIONS = TDKO_DATA.QUESTIONS;

/* ---------- day ---------- */
const now = new Date();
const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const dayNo = window.TDKO_TEST ? TDKO_TEST_NO : LAUNCH==null ? 1 : Math.max(1, Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()) - LAUNCH)/864e5) + 1);
const P = window.TDKO_TEST ? TDKO_T : QUESTIONS[(dayNo-1) % QUESTIONS.length];
const dateLabel = now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const REPLAY = tdkoIsReplay('top-four', dayKey, dayNo), KEY = 'topfour:'+dayKey+'#'+dayNo + (REPLAY?':replay':'');
if(REPLAY){ tdkoReplayKey = KEY; document.documentElement.classList.add('replaying'); }
const app = document.getElementById('app');
document.getElementById('meta').textContent = `No. ${dayNo} · ${dateLabel}`;
const m = /^#c(\d+)-(\d{1,3})$/.exec(location.hash);
const challenge = (m && +m[1]===dayNo && +m[2]<=100) ? +m[2] : null;

/* the starting order is fixed for the day (so friends see the same thing) and never has anyone already in the right place */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const START = (()=>{ const r=rng(dayNo*104729+P.q.length); let a;
  do{ a=[0,1,2,3]; for(let i=3;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }while(a.some((v,i)=>v===i)); return a; })();

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.order)) return s; }catch(e){} return null; }
/* Shared daily status read by The Daily Kick Off menu: tdko:<date>#<no> → {gameId: {status, gaveUp}} */
function report(){ try{ const k='tdko:'+dayKey+'#'+dayNo, all=REPLAY?{}:JSON.parse(localStorage.getItem(k)||'{}'); all['top-four']={status: S.over?'done':S.started?'open':'ready', gaveUp:!!S.gaveUp}; if(REPLAY){ tdkoReplayDone('top-four',dayKey,all['top-four']); return; } localStorage.setItem(k, JSON.stringify(all)); tdkoStamp(k,'top-four',all['top-four']); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} report(); }
let S = load() || {started:false, t0:0, order:START.slice(), tries:[], over:false, won:false, gaveUp:false, time:0};

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secs = () => S.over ? S.time : (S.started ? (Date.now()-S.t0)/1000 : 0);
const ptsAt = t => t<=FREE ? 100 : Math.max(0, 100 - 10*Math.ceil((t-FREE)/STEP));
const score = () => S.won ? ptsAt(S.time) : (S.over ? 0 : ptsAt(secs()));
const locked = i => S.order[i]===i && S.tries.length>0 && S.tries[S.tries.length-1][i];
const fmtT = t => t<60 ? t.toFixed(1)+'s' : `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;

/* A press acts on pointerdown; see Offside for why the follow-up click is swallowed after a touch. */
let swallowUntil = 0;
document.addEventListener('pointerdown', ()=>{ swallowUntil = 0; }, true);
document.addEventListener('click', e=>{ if(performance.now() < swallowUntil){ swallowUntil = 0; e.preventDefault(); e.stopPropagation(); } }, true);
function onPress(el, fn){
  let fired = false;
  const off = () => el.disabled || el.getAttribute('aria-disabled')==='true';
  el.addEventListener('pointerdown', e=>{ if(e.button!==0 || off()) return; e.preventDefault();
    if(e.pointerType==='mouse') fired = true; else swallowUntil = performance.now() + 600; fn(); });
  el.addEventListener('click', ()=>{ if(fired){ fired=false; return; } if(!off()) fn(); });
}
let tt=0;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- intro ---------- */
function intro(){
  app.innerHTML = `
  <section class="card enter"><div class="hero">
    <h1>Top<br><i>Four</i></h1>
    <p class="lede">One question, four answers. Put them in order before the clock runs your points down.</p>
    ${challenge!==null?`<div class="challenge"><span>A friend scored this on today's question. Can you beat them?</span><b>${challenge}</b></div>`:''}
    <ul class="rules">
      <li><span>Rank</span>Drag them into order, tap two to swap, or use the arrows</li>
      <li><span>Check</span>As many tries as you like. Anyone in the right place turns green and stays put</li>
      <li><span>Clock</span>Starts when you see the question and keeps running if you leave</li>
      <li><span>Score</span>100 inside 10 seconds, then 10 fewer every 5 seconds. Out of points at 55 seconds</li>
    </ul>
    <div class="ladder" aria-label="Points by time">
      <div class="p100"><b>100</b><span>0–10s</span></div><div class="p60"><b>60</b><span>25–30s</span></div><div class="p30"><b>30</b><span>40–45s</span></div><div class="p0"><b>0</b><span>55s+</span></div>
    </div>
    <button class="btn" id="go">Show me the question</button>
  </div></section>`;
  onPress(document.getElementById('go'), ()=>{ S.started=true; S.t0=Date.now(); save(); game(); });
}

/* ---------- game ---------- */
const UP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>', DOWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
/* next free (unlocked) spot above or below; locked rows are jumped over */
const nextFree = (i,d) => { let j=i+d; while(j>=0&&j<4&&locked(j)) j+=d; return (j>=0&&j<4)?j:-1; };
const canMove = (i,d) => nextFree(i,d)>=0;
let sel=-1, timer=0, just=[];
function rows(){
  return S.order.map((it,i)=>{ const ok=locked(i);
    return `<div class="rk${ok?' ok':''}${sel===i?' sel':''}${just.includes(i)?' just':''}" role="button" tabindex="${ok?-1:0}" data-i="${i}" aria-label="Position ${i+1}: ${esc(P.items[it][0])}${ok?', correct':''}">
      <span class="n">${i+1}</span><span class="nm">${esc(P.items[it][0])}</span>${ok?'<span class="grip">✓</span>':`<span class="mv"><button type="button" class="ar" data-mv="-1" aria-label="Move ${esc(P.items[it][0])} up" ${canMove(i,-1)?'':'disabled'}>${UP}</button><button type="button" class="ar" data-mv="1" aria-label="Move ${esc(P.items[it][0])} down" ${canMove(i,1)?'':'disabled'}>${DOWN}</button></span>`}</div>`; }).join('');
}
function game(){
  if(S.over) return result();
  if(secs()>=OUT) return finish(false);
  const right=S.tries.length?S.tries[S.tries.length-1].filter(Boolean).length:0;
  app.innerHTML = `
  <section class="card">
    <div class="clock">
      <div class="pts"><span class="eyebrow">Points</span><b id="pts">100</b></div>
      <div class="tm"><b id="tm">0.0s</b><span id="nxt"></span></div>
    </div>
    <div class="drain" aria-hidden="true"><i id="drain" style="width:100%"></i></div>
    <div class="qbox"><span class="eyebrow">Rank them</span><h2>${esc(P.q)}</h2></div>
    <div class="table" id="table">
      <div class="end">${esc(P.top)}</div>
      <div id="rows" style="display:flex;flex-direction:column;gap:8px">${rows()}</div>
      <div class="end">${esc(P.bottom)}</div>
    </div>
    <div class="act" style="padding-top:12px">
      <button class="btn" id="check">Lock it in</button>
      <div class="fb ${S.tries.length?'warn':''}" id="fb">${S.tries.length?`${right} in the right place. Keep going.`:'Drag, tap two to swap, or use the arrows'}</div>
    </div>
  </section>
  <div id="giveup"></div>`;
  just=[];
  drawGiveUp(); wire(); tick();
  onPress(document.getElementById('check'), check);
  clearInterval(timer); timer=setInterval(tick,100);
}
function tick(){
  if(S.over){ clearInterval(timer); return; }
  const t=secs(), p=ptsAt(t);
  if(t>=OUT){ clearInterval(timer); return finish(false); }
  const pe=document.getElementById('pts'); if(!pe) return;
  pe.textContent=p; pe.className = p<=30?'low':p<=60?'mid':'';
  document.getElementById('tm').textContent=fmtT(t);
  const nextDrop = t<FREE ? FREE : FREE+STEP*Math.ceil((t-FREE)/STEP+1e-9);
  document.getElementById('nxt').textContent = `${Math.max(0,p-10)} in ${Math.ceil(nextDrop-t)}s`;
  document.getElementById('drain').style.width = Math.max(0,100*(1-t/OUT))+'%';
}
function swap(a,b){ if(a===b||locked(a)||locked(b)) return; [S.order[a],S.order[b]]=[S.order[b],S.order[a]]; just=[a,b]; save(); }
function redraw(){ const r=document.getElementById('rows'); if(!r) return; r.innerHTML=rows(); just=[]; wire(); }
/* drag a row onto another to swap them; a tap selects, a second tap swaps */
function wire(){
  const els=[...document.querySelectorAll('#rows .rk')];
  els.forEach(el=>{
    const i=+el.dataset.i; if(locked(i)) return;
    el.querySelectorAll('.ar').forEach(a=>{
      a.addEventListener('pointerdown', e=>{ e.stopPropagation(); e.preventDefault(); if(a.disabled) return; if(e.pointerType!=='mouse') swallowUntil=performance.now()+600; move(i,+a.dataset.mv); });
      a.addEventListener('click', e=>{ e.stopPropagation(); if(e.detail===0 && !a.disabled) move(i,+a.dataset.mv); }); });
    let sy=0, moved=false, rects=[], over=-1, pid=null;
    el.addEventListener('pointerdown', e=>{ if(e.button!==0) return; e.preventDefault(); pid=e.pointerId; try{el.setPointerCapture(pid);}catch(_){} sy=e.clientY; moved=false; over=-1;
      rects=els.map(x=>x.getBoundingClientRect()); });
    el.addEventListener('pointermove', e=>{ if(pid!==e.pointerId) return; const dy=e.clientY-sy;
      if(!moved && Math.abs(dy)>6){ moved=true; el.classList.add('lift'); sel=-1; els.forEach(x=>x.classList.remove('sel')); }
      if(!moved) return; el.style.transform=`translateY(${dy}px)`;
      const me=rects[i], cy=(me.top+me.bottom)/2+dy, h=me.bottom-me.top; let t=-1, best=1e9;
      rects.forEach((r,k)=>{ if(k===i||locked(k)) return; const d=Math.abs((r.top+r.bottom)/2-cy); if(d<best){ best=d; t=k; } });
      if(best>h*0.75) t=-1;
      if(t!==over){ if(over>=0) els[over].classList.remove('over'); over=t; if(t>=0) els[t].classList.add('over'); } });
    const end=e=>{ if(pid!==e.pointerId) return; pid=null; el.style.transform=''; el.classList.remove('lift');
      if(moved){ if(over>=0) swap(i,over); redraw(); return; }
      swallowUntil = e.pointerType==='mouse'?0:performance.now()+600; tap(i); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', e=>{ if(pid!==e.pointerId) return; pid=null; el.style.transform=''; el.classList.remove('lift'); redraw(); });
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(i); }
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); let j=i+(e.key==='ArrowUp'?-1:1); while(j>=0&&j<4&&locked(j)) j+=(e.key==='ArrowUp'?-1:1);
        if(j>=0&&j<4){ swap(i,j); redraw(); const n=document.querySelector(`#rows .rk[data-i="${j}"]`); if(n) n.focus(); } } });
  });
}
function move(i,d){ const j=nextFree(i,d); if(j<0) return; sel=-1; swap(i,j); redraw(); const n=document.querySelector(`#rows .rk[data-i="${j}"] .ar[data-mv="${d}"]`)||document.querySelector(`#rows .rk[data-i="${j}"]`); if(n&&!n.disabled&&matchMedia('(hover: hover)').matches) n.focus(); }
function tap(i){ if(sel<0){ sel=i; } else if(sel===i){ sel=-1; } else { swap(sel,i); sel=-1; } redraw(); }
function check(){
  if(S.over) return;
  const t=secs(); if(t>=OUT) return finish(false);
  const hit=S.order.map((v,i)=>v===i); S.tries.push(hit);
  if(hit.every(Boolean)){ S.won=true; return finish(true, t); }
  save(); sel=-1; game();
  const fb=document.getElementById('fb'); if(fb){ const n=hit.filter(Boolean).length; fb.textContent = n===0?'None in the right place yet. Keep going.':`${n} in the right place. Keep going.`; }
}
function finish(won, t){ clearInterval(timer); S.over=true; S.won=won; S.time = won ? t : Math.min(secs(), OUT); save(); result(); }
let confirmOpen=false;
function drawGiveUp(){
  const g=document.getElementById('giveup'); if(!g) return;
  g.innerHTML = confirmOpen ? `<div class="confirm"><p>Are you sure? Giving up ends today's game on 0 points and reveals the answer.</p>
    <div class="actions"><button class="btn ghost" id="keep">Keep playing</button><button class="btn danger" id="quit">Give up</button></div></div>`
    : `<div style="display:flex;justify-content:center"><button class="linkbtn" id="gu">Give up</button></div>`;
  if(confirmOpen){ onPress(document.getElementById('keep'),()=>{confirmOpen=false;drawGiveUp();}); onPress(document.getElementById('quit'),()=>{confirmOpen=false;clearInterval(timer);S.over=true;S.won=false;S.gaveUp=true;S.time=secs();save();result();}); }
  else onPress(document.getElementById('gu'),()=>{confirmOpen=true;drawGiveUp();});
}

/* ---------- result ---------- */
function verdict(s){
  if(S.gaveUp) return 'Gave up';
  if(!S.won) return 'Relegated: out of time';
  if(s===100) return 'Top of the league';
  if(s>=70) return 'Champions League places';
  if(s>=40) return 'Comfortable mid-table';
  return 'Survived on the last day';
}
function inviteUrl(){ return `${GAME_URL}#top-four-c${dayNo}-${score()}`; }
const marks = () => S.tries.map(r=>r.map(x=>x?'🟩':'⬜').join('')).join('\n');
function inviteText(){
  const s=score(), n=S.tries.length;
  const head = S.won ? `📊 Top Four No. ${dayNo}: ranked in ${fmtT(S.time)}, ${n} ${n===1?'try':'tries'} (${s}/100)` : (S.gaveUp ? `📊 Top Four No. ${dayNo}: 🏳️ gave up (0/100)` : `📊 Top Four No. ${dayNo}: ran out of time (0/100)`);
  return `${head}${n?'\n'+marks():''}\n\nOne question, four answers, against the clock. Can you rank them quicker?\nBeat my score: ${inviteUrl()}`;
}
let cdTimer=0;
function result(){
  clearInterval(timer);
  const s=score(), n=S.tries.length;
  let vs='';
  if(challenge!==null){ const d=s-challenge; vs=`<div class="vs">Your friend: <b>${challenge}</b> · ${d>0?`You win by <b>${d}</b>`:d<0?`They win by <b>${-d}</b>`:'<b>Level</b>, a draw'}</div>`; }
  app.innerHTML = `
  <section class="card enter">
    <div class="qbox"><span class="eyebrow">The answer</span><h2>${esc(P.q)}</h2></div>
    <div class="table">
      <div class="end">${esc(P.top)}</div>
      ${P.items.map((it,i)=>`<div class="rk res ok"><span class="n">${i+1}</span><span class="nm">${esc(it[0])}</span><span class="val">${esc(it[1])}</span></div>`).join('')}
      <div class="end">${esc(P.bottom)}</div>
      ${P.note?`<p class="note2">${esc(P.note)}</p>`:''}
    </div>
    <div class="inner">
      ${S.gaveUp?'<span class="flag">Gave up</span>':''}
      <div class="score"><b id="scr">0</b><span>/ 100</span></div>
      <p class="verdict">${verdict(s)}</p>
      <span class="eyebrow">${S.won?`Ranked in ${fmtT(S.time)} · ${n} ${n===1?'try':'tries'}`:S.gaveUp?`Gave up after ${fmtT(S.time)}`:'The clock ran out at 55 seconds'}</span>
      ${n?`<div class="tries" aria-label="Your tries">${S.tries.map(r=>`<div>${r.map(x=>`<i class="${x?'g':''}"></i>`).join('')}</div>`).join('')}</div>`:''}
      ${vs}
    </div>
  </section>
  ${typeof tdkoStreakCard==='function'?tdkoStreakCard('top-four'):''}
  <section class="card sharecard"><div class="inner share">
    <h3>Challenge &amp; share</h3>
    <img id="cardimg" alt="Top Four share card showing a score of ${s} out of 100">
    <p>Share today's puzzle and your score with friends and see if they can beat it.</p>
    <button class="btn" id="shareBtn">Share now</button>
    <div class="sendto" id="sendto" hidden>
      <span class="eyebrow">Send with</span>
      <div class="targets">
        <a class="tgt wa" id="t-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="tgt" id="t-x" target="_blank" rel="noopener">X</a>
        <a class="tgt" id="t-tg" target="_blank" rel="noopener">Telegram</a>
        <a class="tgt" id="t-fb" target="_blank" rel="noopener">Facebook</a>
      </div>
      <button class="linkbtn" id="copyInvite">Or copy the invite</button>
    </div>
  </div></section>
  ${tdkoReplayBox(REPLAY)}
  <div class="next"><span class="eyebrow">Next question in</span><b id="cd">--:--:--</b></div>`;

  const el=document.getElementById('scr'), t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function up(){const p=reduce?1:Math.min(1,(performance.now()-t0)/800); el.textContent=Math.round(s*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(up)})();

  let cardBlob=null;
  drawCard().then(b=>{ cardBlob=b; if(b) document.getElementById('cardimg').src=URL.createObjectURL(b); });

  const full=inviteText(), url=inviteUrl(), noUrl=full.replace(/\nBeat my score: .*$/,'\nBeat my score:'), E=encodeURIComponent;
  document.getElementById('t-wa').href=`https://wa.me/?text=${E(full)}`;
  document.getElementById('t-x').href=`https://x.com/intent/post?text=${E(noUrl)}&url=${E(url)}`;
  document.getElementById('t-tg').href=`https://t.me/share/url?url=${E(url)}&text=${E(noUrl)}`;
  document.getElementById('t-fb').href=`https://www.facebook.com/sharer/sharer.php?u=${E(url)}`;
  const sendto=document.getElementById('sendto');
  const showTargets=()=>{ sendto.hidden=false; sendto.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'}); };
  document.getElementById('shareBtn').addEventListener('click', async ()=>{
    if(!navigator.share) return showTargets();
    const data={title:'Top Four', text:full};
    try{ const f=cardBlob&&new File([cardBlob],`top-four-${dayNo}.png`,{type:'image/png'}); if(f&&navigator.canShare&&navigator.canShare({files:[f]})) data.files=[f]; }catch(e){}
    try{ await navigator.share(data); }catch(e){ if(e&&e.name==='AbortError') return; showTargets(); }
  });
  document.getElementById('copyInvite').addEventListener('click', ()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.className='copybox'; t.readOnly=true; t.value=full; document.getElementById('copyInvite').replaceWith(t); t.focus(); t.select(); toast('Select the text and copy it'); };
    try{ navigator.clipboard.writeText(full).then(()=>toast('Invite copied. Paste it to a friend'),fb); }catch(e){ fb(); }
  });

  clearInterval(cdTimer);
  const tk=()=>{const n=new Date(),mid=new Date(n);mid.setHours(24,0,0,0);const d=Math.max(0,(mid-n)/1000|0);
    if(d===0){ clearInterval(cdTimer); return location.reload(); }
    const c=document.getElementById('cd'); if(c) c.textContent=`${String(d/3600|0).padStart(2,'0')}:${String(d%3600/60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;};
  tk(); cdTimer=setInterval(tk,1000);
}

/* ---------- share card (1080×1080): score, time and the tries grid, never the answer ---------- */
async function drawCard(){
  try{ await Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 40px Archivo'),document.fonts.load('600 30px "IBM Plex Mono"')]); }catch(e){}
  const W=1080, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d'); if(!x) return null;
  const C={bg:'#0B110E',ink:'#EAF0EC',muted:'#8A988F',line:'#24302A',acc:'#34D27F',accInk:'#06120B',warn:'#F2B53A',bad:'#FF6B5A'};
  const cond=v=>{ if('fontStretch' in x) x.fontStretch=v; };
  const Pd=80, s=score();
  x.fillStyle=C.bg; x.fillRect(0,0,W,W);
  x.strokeStyle=C.line; x.lineWidth=4; x.beginPath(); x.arc(W+40,W*0.42,300,0,Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(W-260,0); x.lineTo(W-260,W); x.stroke();
  cond('condensed'); x.font='900 60px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  x.fillText('TOP ',Pd,Pd+50); const w=x.measureText('TOP ').width; x.fillStyle=C.acc; x.fillText('FOUR',Pd+w,Pd+50);
  cond('normal'); x.font='600 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.textAlign='right';
  x.fillText(`NO. ${dayNo} · ${dateLabel.toUpperCase()}`,W-Pd,Pd+46); x.textAlign='left';
  x.fillStyle=C.ink; x.fillRect(Pd,Pd+80,W-2*Pd,4);
  x.font='600 28px "IBM Plex Mono",monospace'; x.fillStyle=C.muted;
  x.fillText(S.won?`RANKED IN ${fmtT(S.time).toUpperCase()}`:S.gaveUp?'I GAVE UP TODAY':'THE CLOCK BEAT ME TODAY',Pd,Pd+170);
  cond('condensed'); x.font='900 300px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink;
  const sw=x.measureText(String(s)).width; x.fillText(String(s),Pd-8,Pd+430);
  cond('normal'); x.font='600 48px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('/100',Pd+sw+10,Pd+430);
  cond('condensed'); x.font='800 52px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=s?C.acc:C.bad; x.fillText(verdict(s).toUpperCase(),Pd,Pd+505);
  // tries grid: one row per go, green for a right spot (up to 6 rows shown)
  const rowsShown=S.tries.slice(-6), cs=44, g=10, gy=Pd+550;
  rowsShown.forEach((r,ri)=>r.forEach((ok,ci)=>{ x.fillStyle=ok?C.acc:C.line; x.fillRect(Pd+ci*(cs+g), gy+ri*(cs+g), cs, cs); }));
  if(S.tries.length>6){ x.font='600 22px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText(`+${S.tries.length-6} EARLIER`,Pd+4*(cs+g)+12,gy+28); }
  const by=W-Pd-20;
  cond('condensed'); x.font='800 46px Archivo,"Arial Narrow",sans-serif'; x.fillStyle=C.ink; x.fillText('CAN YOU RANK THEM QUICKER?',Pd,by-46);
  cond('normal'); x.font='500 24px "IBM Plex Mono",monospace'; x.fillStyle=C.muted; x.fillText('ONE QUESTION · FOUR ANSWERS · AGAINST THE CLOCK',Pd,by);
  return new Promise(r=>c.toBlob(b=>r(b),'image/png'));
}

/* ---------- day rollover ---------- */
const openedOn = (d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`)(new Date());
const rollCheck = () => { const d=new Date(); if(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`!==openedOn) location.reload(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rollCheck(); });
addEventListener('focus', rollCheck);

/* ---------- boot ---------- */
if(S.over) result(); else if(S.started) game(); else intro();
})();

  var MPQ='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="8.5" r="2.5"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M13.5 15.2a4.5 4.5 0 0 1 8 3.3"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';
  var bar=document.createElement('div'); bar.className='statusbar'; bar.setAttribute('role','note');
  bar.innerHTML='<span></span>'
    +'<span class="sb-right"><span class="counts" hidden><span class="sb-count" title="Total visits since 10 Nov 2026">'+EYE+'<span id="tdko-visits"></span><span class="sr" style="position:absolute;left:-9999px"> visits</span></span>'
    +'<span class="sb-count" title="Unique players since 10 Nov 2026">'+USER+'<span id="tdko-uniques"></span><span class="sr" style="position:absolute;left:-9999px"> unique players</span></span>'

    +'<span class="sb-count" id="tdko-mpwrap" title="Multiplayer quizzes completed" hidden>'+MPQ+'<span id="tdko-mp"></span><span class="sr" style="position:absolute;left:-9999px"> multiplayer quizzes completed</span></span></span>'
    +'<button type="button" class="themebtn"></button></span>';
  document.body.insertBefore(bar, w);
  /* testers only ever see Test day; the Exit tag locks this device again (holding page before launch, the real game after) */
  var TEST=!!window.TDKO_TEST;
  if(TEST) try{ var right=bar.querySelector('.sb-right');
    var tg=document.createElement('button'); tg.type='button'; tg.className='testertag on'; tg.textContent='Exit Training Ground'; tg.title='Leave the Training Ground on this device';
    tg.addEventListener('click',function(){ try{localStorage.removeItem('tdko-tester')}catch(e){} location.replace('./'); });
    right.insertBefore(tg, right.firstChild); bar.classList.add('is-tester'); }catch(e){}
  if(TEST){ var mt=document.querySelector('header.top .meta'); if(mt && !document.getElementById('fixtures')) mt.textContent='Training Ground'; }
  var btn=bar.querySelector('.themebtn');
  var paint=function(){ var d=cur()==='dark'; btn.innerHTML=d?SUN:MOON; btn.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode'); btn.title=btn.getAttribute('aria-label'); };
  btn.addEventListener('click',function(){ var next=cur()==='dark'?'light':'dark'; root.setAttribute('data-tdko',next); try{localStorage.setItem('tdko-theme',next)}catch(e){} paint(); });
  addEventListener('storage',function(e){ if(e.key==='tdko-theme'&&(e.newValue==='light'||e.newValue==='dark')){ root.setAttribute('data-tdko',e.newValue); paint(); } });
  paint();
  /* counters: a visit = opening the site in a new tab or session; a unique player = a new device (random id, nothing personal) */
  var vid=null, visit=false;
  try{ vid=localStorage.getItem('tdko-vid'); if(!vid){ vid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)); localStorage.setItem('tdko-vid',vid); } }catch(e){}
  /* a visit = a new tab or session, or the first page of a new day in an open tab (so every device seen on a day has at least one visit that day) */
  try{ var vd=(function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(new Date());
    if(sessionStorage.getItem('tdko-sess')!==vd){ sessionStorage.setItem('tdko-sess',vd); visit=true; } }catch(e){}
  var fmt=function(n){ return Number(n).toLocaleString('en-GB'); };
  /* 'Don't count my visits' (privacy page) sets tdko-nocount: the counters are still shown, but this device is never counted */
  var NOC=false; try{ NOC=localStorage.getItem('tdko-nocount')==='1'; }catch(e){}
  if(!TEST) try{ fetch('/api/hit',NOC?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({vid:vid,visit:visit,page:location.pathname.replace(/^.*\//,'').replace(/\.html$/,''),day:(function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(new Date())})})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ if(!d||typeof d.visits!=='number') return; document.getElementById('tdko-visits').textContent=fmt(d.visits); document.getElementById('tdko-uniques').textContent=fmt(d.uniques); document.getElementById('tdko-done').textContent=fmt(d.completed||0); if(typeof d.mpDone==='number'&&Date.now()>=Date.UTC(2026,10,30)){ document.getElementById('tdko-mp').textContent=fmt(d.mpDone); document.getElementById('tdko-mpwrap').hidden=false; } bar.querySelector('.counts').hidden=false; })
    .catch(function(){}); }catch(e){}
  /* self-healing stats: once a day, re-send what this device's saved progress shows for the last 7 days; anything already counted is ignored,
     anything lost (e.g. the server was down) is added. Days run from 16 Nov 2026 (No. 1). */
  if(!TEST && !NOC && vid) try{
    var td=(function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(new Date());
    if(localStorage.getItem('tdko-backfill')!==td){
      var from=new Date(); from.setDate(from.getDate()-7);
      var fk=from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
      var items=[], days={};
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i), m=/^tdko:(20\d\d-\d\d-\d\d)#\d+$/.exec(k||''); if(!m) continue;
        var day=m[1]; if(day<fk||day<'2026-11-16'||day>td) continue; var all={}; try{ all=JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){}
        for(var g in all){ var s=all[g]; if(!s) continue;
          if(s.status==='open'||s.status==='done'){ items.push({day:day,game:g,event:'start'}); days[day]=1; }
          if(s.status==='done') items.push({day:day,game:g,event:'finish',gaveUp:!!s.gaveUp}); }
        if(localStorage.getItem('tdko-all8:'+day)) items.push({day:day,game:'all',event:'all8'}); }
      var dl=Object.keys(days);
      if(!items.length && !dl.length) localStorage.setItem('tdko-backfill',td);
      else fetch('/api/backfill',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({vid:vid,items:items.slice(0,200),days:dl})})
        .then(function(r){ if(r.ok) localStorage.setItem('tdko-backfill',td); }).catch(function(){});
    } }catch(e){}
})();
/* long game names (Who's That Baller) shrink until the name and the date share one line */
(function(){ var h=document.querySelector('header.top'); if(!h||!h.querySelector('.meta')) return; var t=h.firstElementChild;
  var fit=function(){ t.style.fontSize=''; var f=parseFloat(getComputedStyle(t).fontSize), min=t.classList.contains('mark')?13:8;
    while(h.scrollWidth>h.clientWidth+1 && f>min){ f-=0.5; t.style.fontSize=f+'px'; } };
  fit(); addEventListener('resize',fit); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit); })();
(function(){ var w=document.querySelector('.wrap'); if(!w || w.querySelector('.legal')) return;
  var s=document.createElement('section'); s.className='support';
  s.innerHTML='<p>Like what you see? Help support our next big signings: accounts, progress that follows you across devices, access to the archives, all your stats, leaderboards, private leagues with your friends and more. Every cuppa counts.</p><a class="kofi" href="https://ko-fi.com/tdko" target="_blank" rel="noopener">☕ Support us on Ko-fi</a>';
  w.appendChild(s);
  var f=document.createElement('footer'); f.className='legal';
  f.innerHTML='<div class="socials"><a class="soc soc-fb" href="https://www.facebook.com/tdkoapp" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"></a><a class="soc soc-ig" href="https://www.instagram.com/tdko.app/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"></a><a class="soc soc-x" href="https://x.com/tdkoapp" target="_blank" rel="noopener" aria-label="X" title="X"></a><a class="soc soc-tt" href="https://www.tiktok.com/@tdko.app" target="_blank" rel="noopener" aria-label="TikTok" title="TikTok"></a></div><nav class="flinks" aria-label="Site links"><a href="contact.html">Contact us</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a id="tdko-genrep" href="mailto:hello@tdko.app" target="_blank" rel="noopener">Report a problem</a><a href="training-ground.html">Training Ground</a><a href="performance.html">Performance</a></nav><p>© 2026 The Daily Kick Off. All rights reserved.<br>Not affiliated with any club, league or player.</p>';
  try{ var gr=f.querySelector('#tdko-genrep'), pf=location.pathname.replace(/^.*\//,''), pg=(document.title||'The Daily Kick Off')+(pf&&pf!=='index.html'?' ('+pf+')':''); gr.href='mailto:hello@tdko.app?subject='+encodeURIComponent('Problem on tdko.app: '+pg)+'&body='+encodeURIComponent('Page: '+pg+'\n\nWhat went wrong?\n\n'); }catch(e){}
  w.appendChild(f); })();
</script>
<script>
/* Share block: lifted out of the bottom 'Challenge a friend' card and placed straight under the score verdict, so it is seen
   before people screenshot or move on. The card image is no longer shown (it is still drawn and attached when sharing).
   Share funnel counted per device per day and game: 'share' (tapped the button), 'shared' (sent: share sheet completed,
   a send-with link or copy), 'invite' (arrived from a friend's challenge link). */
(function(){ var T='Challenge a friend to beat it, or post it to your story and tag The Daily Kick Off for a shot at our Hall of Fame.';
  var st=document.createElement('style'); st.textContent=
   '.share.share-top{margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}'+
   '.share.share-top h3,.share.share-top img{display:none}'+
   '.share.share-top .btn{order:-1;margin:0 0 2px;width:100%;padding-top:12px;padding-bottom:12px}'+
   '.share.share-top p{display:none}.share.share-top p.storyline{display:block;margin:0;font-size:11.5px;line-height:1.35;color:var(--muted)}'+
   '.share-top .replay-mini{order:-2}.replay-mini{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;line-height:1}'+
   '.replay-mini svg{width:14px;height:14px}'+
   '.replaying .share-top,.tdko-test .share-top{display:none !important}';
  document.head.appendChild(st);
  var TEST=!!window.TDKO_TEST, game=(location.pathname.replace(/^.*\//,'').replace(/\.html$/,'')||'');
  var day=function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  var post=function(ev){ if(TEST||!game) return; var vid=null,noc=false; try{ vid=localStorage.getItem('tdko-vid'); noc=localStorage.getItem('tdko-nocount')==='1'; }catch(e){}
    if(!vid||noc) return; try{ fetch('/api/play',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({vid:vid,day:day(),game:game,event:ev})}).catch(function(){}); }catch(e){} };
  if(/^#c\d+-\d{1,3}/.test(location.hash)) post('invite');
  try{ if(navigator.share){ var o=navigator.share.bind(navigator); Object.defineProperty(navigator,'share',{configurable:true,value:function(d){ return o(d).then(function(r){ post('shared'); return r; }); }}); } }catch(e){}
  document.addEventListener('click',function(e){ var t=e.target.closest&&e.target.closest('.share'); if(!t) return;
    if(e.target.closest('.tgt,#copyInvite')) post('shared'); else if(e.target.closest('.btn')) post('share'); },true);
  var lift=function(){ document.querySelectorAll('.sharecard .share').forEach(function(sh){
      var p=sh.querySelector('p'); if(p&&!sh.querySelector('.storyline')){ var n=document.createElement('p'); n.className='storyline'; n.textContent=T; p.insertAdjacentElement('afterend',n); }
      var b=sh.querySelector('.btn'); if(b&&!b.dataset.lifted){ b.dataset.lifted='1'; b.textContent='Share my score'; }
      var v=document.querySelector('.verdict'), card=sh.closest('.sharecard');
      if(v&&card){ sh.classList.add('share-top'); v.insertAdjacentElement('afterend',sh); card.remove();
        /* tighter result card so the score, share, replay and stats fit on the first screen */
        var bx=v.parentElement, cs=getComputedStyle(bx); if(parseFloat(cs.rowGap)>12) bx.style.rowGap='12px';
        if(parseFloat(cs.paddingTop)>16 && !bx.style.paddingTop) bx.style.paddingTop='16px';
        v.style.lineHeight='1.1';
        /* results always sit below Share: whatever came before the score (answer reveal, board, route, line-up, list) moves under it.
           Shirt Swap's Easy/Medium/Hard tabs stay at the top. */
        var crd=bx.parentElement;
        if(crd && crd.matches('section.card') && !crd.dataset.ro){ crd.dataset.ro='1'; var pre=[], moved=false;
          for(var el=crd.firstElementChild; el && el!==bx; el=el.nextElementSibling) if(!el.matches('.modes')) pre.push(el);
          var at=bx; pre.forEach(function(el){ at.insertAdjacentElement('afterend',el); at=el; moved=true; });
          [].slice.call(bx.children).filter(function(k){ return k.matches('.reveal'); }).reverse().forEach(function(r){ sh.insertAdjacentElement('afterend',r); moved=true; });
          if(moved && parseFloat(getComputedStyle(bx).paddingTop)<16) bx.style.paddingTop='16px'; } } });
    /* Replay: a small button in the score row (the white space right of the score) instead of a card further down */
    document.querySelectorAll('.replaybox').forEach(function(rb){ var ob=rb.querySelector('[data-replay]'), sc=document.querySelector('.verdict')&&document.querySelector('.score');
      if(!ob||!sc||document.querySelector('.replay-mini')) return;
      var mb=document.createElement('button'); mb.type='button'; mb.className='replay-mini'; mb.setAttribute('data-replay','');
      mb.setAttribute('aria-label',ob.textContent.trim()+': play today\u2019s puzzle again. Your first score stays on the board.');
      mb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'+(/again/i.test(ob.textContent)?'Replay again':'Replay today\u2019s puzzle');
      /* thin full-width button straight above Share my score, the same on every game */
      var top=document.querySelector('.share-top'), v=document.querySelector('.verdict');
      if(top && !document.querySelector('.replaying')) top.insertBefore(mb, top.firstChild); else v.insertAdjacentElement('afterend',mb);
      rb.remove(); }); };
  new MutationObserver(lift).observe(document.body,{childList:true,subtree:true}); lift();
})();
</script>
