/* match the Daily Puzzles type: Archivo condensed for titles and buttons, Plex Mono at 500-600 for labels */
body{line-height:1.45}
h3{font-stretch:80%;font-weight:900;letter-spacing:.01em}

<script>
/* status bar: beta notice, site-wide visit counters, light/dark switch */
(function(){ var w=document.querySelector('.wrap'); if(!w || document.querySelector('.statusbar')) return;
  var root=document.documentElement;
  var cur=function(){ return root.getAttribute('data-tdko')==='dark'?'dark':'light'; };
  var EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var USER='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
  var DONE='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg>';
  var MPQ='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="8.5" r="2.5"/><path d="M2.5 20a5.5 5.5 0 0 1 11 0M13.5 15.2a4.5 4.5 0 0 1 8 3.3"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';
  var bar=document.createElement('div'); bar.className='statusbar'; bar.setAttribute('role','note');
  bar.innerHTML='<span></span>'
    +'<span class="sb-right"><span class="counts" hidden><span class="sb-count" title="Total visits since 10 Nov 2026">'+EYE+'<span id="tdko-visits"></span><span class="sr" style="position:absolute;left:-9999px"> visits</span></span>'
    +'<span class="sb-count" title="Unique players since 10 Nov 2026">'+USER+'<span id="tdko-uniques"></span><span class="sr" style="position:absolute;left:-9999px"> unique players</span></span>'
    +'<span class="sb-count" title="Puzzles completed since launch, 16 Nov 2026">'+DONE+'<span id="tdko-done"></span><span class="sr" style="position:absolute;left:-9999px"> puzzles completed</span></span>'
    +'<span class="sb-count" id="tdko-mpwrap" title="Multiplayer quizzes completed" hidden>'+MPQ+'<span id="tdko-mp"></span><span class="sr" style="position:absolute;left:-9999px"> multiplayer quizzes completed</span></span></span>'
    +'<button type="button" class="themebtn"></button></span>';
  document.body.insertBefore(bar, w);
  /* testers only ever see Test day; the Exit tag locks this device again (holding page before launch, the real game after) */
  var TEST=!!window.TDKO_TEST;
  if(TEST) try{ var right=bar.querySelector('.sb-right');
    var tg=document.createElement('button'); tg.type='button'; tg.className='testertag on'; tg.textContent='Exit Training Ground'; tg.title='Leave the Training Ground on this device';
    tg.addEventListener('click',function(){ try{localStorage.removeItem('tdko-tester')}catch(e){} location.replace('./'); });
    right.insertBefore(tg, right.firstChild); bar.classList.add('is-tester'); }catch(e){}
  if(TEST){ var mt=document.querySelector('header.top .meta'); if(mt && !document.getElementById('fixtures')) mt.textContent='Training Ground'; }
  var btn=bar.querySelector('.themebtn');
  var paint=function(){ var d=cur()==='dark'; btn.innerHTML=d?SUN:MOON; btn.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode'); btn.title=btn.getAttribute('aria-label'); };
  btn.addEventListener('click',function(){ var next=cur()==='dark'?'light':'dark'; root.setAttribute('data-tdko',next); try{localStorage.setItem('tdko-theme',next)}catch(e){} paint(); });
  addEventListener('storage',function(e){ if(e.key==='tdko-theme'&&(e.newValue==='light'||e.newValue==='dark')){ root.setAttribute('data-tdko',e.newValue); paint(); } });
  paint();
  /* counters: a visit = opening the site in a new tab or session; a unique player = a new device (random id, nothing personal) */
  var vid=null, visit=false;
  try{ vid=localStorage.getItem('tdko-vid'); if(!vid){ vid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)); localStorage.setItem('tdko-vid',vid); } }catch(e){}
  /* a visit = a new tab or session, or the first page of a new day in an open tab (so every device seen on a day has at least one visit that day) */
  try{ var vd=(function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(new Date());
    if(sessionStorage.getItem('tdko-sess')!==vd){ sessionStorage.setItem('tdko-sess',vd); visit=true; } }catch(e){}
  var fmt=function(n){ return Number(n).toLocaleString('en-GB'); };
  /* 'Don't count my visits' (privacy page) sets tdko-nocount: the counters are still shown, but this device is never counted */
  var NOC=false; try{ NOC=localStorage.getItem('tdko-nocount')==='1'; }catch(e){}
  if(!TEST) try{ fetch('/api/hit',NOC?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({vid:vid,visit:visit,page:location.pathname.replace(/^.*\//,'').replace(/\.html$/,''),day:(function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(new Date())})})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){ if(!d||typeof d.visits!=='number') return; document.getElementById('tdko-visits').textContent=fmt(d.visits); document.getElementById('tdko-uniques').textContent=fmt(d.uniques); document.getElementById('tdko-done').textContent=fmt(d.completed||0); if(typeof d.mpDone==='number'&&Date.now()>=Date.UTC(2026,10,30)){ document.getElementById('tdko-mp').textContent=fmt(d.mpDone); document.getElementById('tdko-mpwrap').hidden=false; } bar.querySelector('.counts').hidden=false; })
    .catch(function(){}); }catch(e){}
  /* self-healing stats: once a day, re-send what this device's saved progress shows for the last 7 days; anything already counted is ignored,
     anything lost (e.g. the server was down) is added. Days run from 16 Nov 2026 (No. 1). */
  if(!TEST && !NOC && vid) try{
    var td=(function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})(new Date());
    if(localStorage.getItem('tdko-backfill')!==td){
      var from=new Date(); from.setDate(from.getDate()-7);
      var fk=from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
      var items=[], days={};
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i), m=/^tdko:(20\d\d-\d\d-\d\d)#\d+$/.exec(k||''); if(!m) continue;
        var day=m[1]; if(day<fk||day<'2026-11-16'||day>td) continue; var all={}; try{ all=JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){}
        for(var g in all){ var s=all[g]; if(!s) continue;
          if(s.status==='open'||s.status==='done'){ items.push({day:day,game:g,event:'start'}); days[day]=1; }
          if(s.status==='done') items.push({day:day,game:g,event:'finish',gaveUp:!!s.gaveUp}); }
        if(localStorage.getItem('tdko-all8:'+day)) items.push({day:day,game:'all',event:'all8'}); }
      var dl=Object.keys(days);
      if(!items.length && !dl.length) localStorage.setItem('tdko-backfill',td);
      else fetch('/api/backfill',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({vid:vid,items:items.slice(0,200),days:dl})})
        .then(function(r){ if(r.ok) localStorage.setItem('tdko-backfill',td); }).catch(function(){});
    } }catch(e){}
})();
/* long game names (Who's That Baller) shrink until the name and the date share one line */
(function(){ var h=document.querySelector('header.top'); if(!h||!h.querySelector('.meta')) return; var t=h.firstElementChild;
  var fit=function(){ t.style.fontSize=''; var f=parseFloat(getComputedStyle(t).fontSize), min=t.classList.contains('mark')?13:8;
    while(h.scrollWidth>h.clientWidth+1 && f>min){ f-=0.5; t.style.fontSize=f+'px'; } };
  fit(); addEventListener('resize',fit); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit); })();
(function(){ var w=document.querySelector('.wrap'); if(!w || w.querySelector('.legal')) return;
  var s=document.createElement('section'); s.className='support';
  s.innerHTML='<p>Like what you see? Help support our next big signings: accounts, progress that follows you across devices, access to the archives, all your stats, leaderboards, private leagues with your friends and more. Every cuppa counts.</p><a class="kofi" href="https://ko-fi.com/tdko" target="_blank" rel="noopener">☕ Support us on Ko-fi</a>';
  w.appendChild(s);
  var f=document.createElement('footer'); f.className='legal';
  f.innerHTML='<div class="socials"><a class="soc soc-fb" href="https://www.facebook.com/tdkoapp" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook"></a><a class="soc soc-ig" href="https://www.instagram.com/tdko.app/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"></a><a class="soc soc-x" href="https://x.com/tdkoapp" target="_blank" rel="noopener" aria-label="X" title="X"></a><a class="soc soc-tt" href="https://www.tiktok.com/@tdko.app" target="_blank" rel="noopener" aria-label="TikTok" title="TikTok"></a></div><nav class="flinks" aria-label="Site links"><a href="contact.html">Contact us</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a id="tdko-genrep" href="mailto:hello@tdko.app" target="_blank" rel="noopener">Report a problem</a><a href="training-ground.html">Training Ground</a><a href="performance.html">Performance</a></nav><p>© 2026 The Daily Kick Off. All rights reserved.<br>Not affiliated with any club, league or player.</p>';
  try{ var gr=f.querySelector('#tdko-genrep'), pf=location.pathname.replace(/^.*\//,''), pg=(document.title||'The Daily Kick Off')+(pf&&pf!=='index.html'?' ('+pf+')':''); gr.href='mailto:hello@tdko.app?subject='+encodeURIComponent('Problem on tdko.app: '+pg)+'&body='+encodeURIComponent('Page: '+pg+'\n\nWhat went wrong?\n\n'); }catch(e){}
  w.appendChild(f); })();
</script>
<script>
/* Share block: lifted out of the bottom 'Challenge a friend' card and placed straight under the score verdict, so it is seen
   before people screenshot or move on. The card image is no longer shown (it is still drawn and attached when sharing).
   Share funnel counted per device per day and game: 'share' (tapped the button), 'shared' (sent: share sheet completed,
   a send-with link or copy), 'invite' (arrived from a friend's challenge link). */
(function(){ var T='Challenge a friend to beat it, or post it to your story and tag The Daily Kick Off for a shot at our Hall of Fame.';
  var st=document.createElement('style'); st.textContent=
   '.share.share-top{margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}'+
   '.share.share-top h3,.share.share-top img{display:none}'+
   '.share.share-top .btn{order:-1;margin:0 0 2px;width:100%;padding-top:12px;padding-bottom:12px}'+
   '.share.share-top p{display:none}.share.share-top p.storyline{display:block;margin:0;font-size:11.5px;line-height:1.35;color:var(--muted)}'+
   '.share-top .replay-mini{order:-2}.replay-mini{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;line-height:1}'+
   '.replay-mini svg{width:14px;height:14px}'+
   '.replaying .share-top,.tdko-test .share-top{display:none !important}';
  document.head.appendChild(st);
  var TEST=!!window.TDKO_TEST, game=(location.pathname.replace(/^.*\//,'').replace(/\.html$/,'')||'');
  var day=function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  var post=function(ev){ if(TEST||!game) return; var vid=null,noc=false; try{ vid=localStorage.getItem('tdko-vid'); noc=localStorage.getItem('tdko-nocount')==='1'; }catch(e){}
    if(!vid||noc) return; try{ fetch('/api/play',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({vid:vid,day:day(),game:game,event:ev})}).catch(function(){}); }catch(e){} };
  if(/^#c\d+-\d{1,3}/.test(location.hash)) post('invite');
  try{ if(navigator.share){ var o=navigator.share.bind(navigator); Object.defineProperty(navigator,'share',{configurable:true,value:function(d){ return o(d).then(function(r){ post('shared'); return r; }); }}); } }catch(e){}
  document.addEventListener('click',function(e){ var t=e.target.closest&&e.target.closest('.share'); if(!t) return;
    if(e.target.closest('.tgt,#copyInvite')) post('shared'); else if(e.target.closest('.btn')) post('share'); },true);
  var lift=function(){ document.querySelectorAll('.sharecard .share').forEach(function(sh){
      var p=sh.querySelector('p'); if(p&&!sh.querySelector('.storyline')){ var n=document.createElement('p'); n.className='storyline'; n.textContent=T; p.insertAdjacentElement('afterend',n); }
      var b=sh.querySelector('.btn'); if(b&&!b.dataset.lifted){ b.dataset.lifted='1'; b.textContent='Share my score'; }
      var v=document.querySelector('.verdict'), card=sh.closest('.sharecard');
      if(v&&card){ sh.classList.add('share-top'); v.insertAdjacentElement('afterend',sh); card.remove();
        /* tighter result card so the score, share, replay and stats fit on the first screen */
        var bx=v.parentElement, cs=getComputedStyle(bx); if(parseFloat(cs.rowGap)>12) bx.style.rowGap='12px';
        if(parseFloat(cs.paddingTop)>16 && !bx.style.paddingTop) bx.style.paddingTop='16px';
        v.style.lineHeight='1.1';
        /* results always sit below Share: whatever came before the score (answer reveal, board, route, line-up, list) moves under it.
           Shirt Swap's Easy/Medium/Hard tabs stay at the top. */
        var crd=bx.parentElement;
        if(crd && crd.matches('section.card') && !crd.dataset.ro){ crd.dataset.ro='1'; var pre=[], moved=false;
          for(var el=crd.firstElementChild; el && el!==bx; el=el.nextElementSibling) if(!el.matches('.modes')) pre.push(el);
          var at=bx; pre.forEach(function(el){ at.insertAdjacentElement('afterend',el); at=el; moved=true; });
          [].slice.call(bx.children).filter(function(k){ return k.matches('.reveal'); }).reverse().forEach(function(r){ sh.insertAdjacentElement('afterend',r); moved=true; });
          if(moved && parseFloat(getComputedStyle(bx).paddingTop)<16) bx.style.paddingTop='16px'; } } });
    /* Replay: a small button in the score row (the white space right of the score) instead of a card further down */
    document.querySelectorAll('.replaybox').forEach(function(rb){ var ob=rb.querySelector('[data-replay]'), sc=document.querySelector('.verdict')&&document.querySelector('.score');
      if(!ob||!sc||document.querySelector('.replay-mini')) return;
      var mb=document.createElement('button'); mb.type='button'; mb.className='replay-mini'; mb.setAttribute('data-replay','');
      mb.setAttribute('aria-label',ob.textContent.trim()+': play today\u2019s puzzle again. Your first score stays on the board.');
      mb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>'+(/again/i.test(ob.textContent)?'Replay again':'Replay today\u2019s puzzle');
      /* thin full-width button straight above Share my score, the same on every game */
      var top=document.querySelector('.share-top'), v=document.querySelector('.verdict');
      if(top && !document.querySelector('.replaying')) top.insertBefore(mb, top.firstChild); else v.insertAdjacentElement('afterend',mb);
      rb.remove(); }); };
  new MutationObserver(lift).observe(document.body,{childList:true,subtree:true}); lift();
})();
</script>
